services:
  - type: web
    name: flashsale-payment-api-preview
    runtime: docker
    plan: free
    region: oregon
    branch: preview
    autoDeploy: false
    healthCheckPath: /health/live
    dockerfilePath: ./src/payment-service-java/Dockerfile
    dockerContext: ./src/payment-service-java
    envVars:
      - key: PORT
        value: "8080"
      - key: SERVER_PORT
        value: "8080"
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_DATA_REDIS_HOST
        sync: false
      - key: SPRING_DATA_REDIS_PORT
        value: "6379"
      - key: SPRING_RABBITMQ_HOST
        sync: false
      - key: SPRING_RABBITMQ_PORT
        value: "5672"
      - key: SPRING_RABBITMQ_USERNAME
        sync: false
      - key: SPRING_RABBITMQ_PASSWORD
        sync: false
      - key: OIDC_ISSUER_URI
        sync: false
      - key: OIDC_AUDIENCE
        sync: false
      - key: OIDC_AUTHORITIES_CLAIM
        value: roles
      - key: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
        value: "health,info,metrics,prometheus"

  - type: web
    name: flashsale-payment-api-prod
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    autoDeploy: false
    healthCheckPath: /health/live
    dockerfilePath: ./src/payment-service-java/Dockerfile
    dockerContext: ./src/payment-service-java
    envVars:
      - key: PORT
        value: "8080"
      - key: SERVER_PORT
        value: "8080"
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_DATA_REDIS_HOST
        sync: false
      - key: SPRING_DATA_REDIS_PORT
        value: "6379"
      - key: SPRING_RABBITMQ_HOST
        sync: false
      - key: SPRING_RABBITMQ_PORT
        value: "5672"
      - key: SPRING_RABBITMQ_USERNAME
        sync: false
      - key: SPRING_RABBITMQ_PASSWORD
        sync: false
      - key: OIDC_ISSUER_URI
        sync: false
      - key: OIDC_AUDIENCE
        sync: false
      - key: OIDC_AUTHORITIES_CLAIM
        value: roles
      - key: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
        value: "health,info,metrics,prometheus"
