name: Observability

on:
  push:
    branches: [main, master, develop]
    paths: ['observability/**']
  pull_request:
    branches: [main, master, develop]
    paths: ['observability/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-config:
    # Docker is not started in CI, so the observability stack is validated by
    # parsing every YAML/JSON it ships and checking dashboard uids. That is what
    # actually breaks in review; the stack itself is a local/demo tool.
    name: observability config parses
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: observability
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parsers
        run: python -m pip install --upgrade pip pyyaml

      - name: Parse prometheus / grafana / alertmanager / slo / compose configs
        run: python scripts/validate_configs.py

      - name: Upload parsed config as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: observability-config
          path: |
            observability/prometheus/
            observability/alertmanager/
            observability/grafana/
            observability/slo.yaml
            observability/docker-compose.yml
          retention-days: 14
