name: Payment Service Java CI

on:
  push:
    branches: [main]
    paths:
      - 'src/payment-service-java/**'
  pull_request:
    paths:
      - 'src/payment-service-java/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build with Maven
        working-directory: src/payment-service-java
        run: mvn -B -q compile
      - name: Run unit tests
        working-directory: src/payment-service-java
        run: mvn -B test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payment-service-test-results
          path: src/payment-service-java/target/surefire-reports/
          if-no-files-found: ignore

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: FlashSaleDb
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d FlashSaleDb"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 10s --health-timeout 5s --health-retries 8
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run integration tests
        working-directory: src/payment-service-java
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/FlashSaleDb
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_RABBITMQ_HOST: localhost
          SPRING_RABBITMQ_PORT: 5672
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
          APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
        run: mvn -B verify

  docker-build-scan:
    runs-on: ubuntu-latest
    needs: [build-and-unit, integration-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build payment-service-java image
        uses: docker/build-push-action@v6
        with:
          context: src/payment-service-java
          file: src/payment-service-java/Dockerfile
          push: false
          load: true
          tags: flashsale/payment-service-java:ci-${{ github.sha }}
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: flashsale/payment-service-java:ci-${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
