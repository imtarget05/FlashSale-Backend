# =============================================================================
# CI Live — FlashSale OrderFlow integration (MANUAL ONLY)
#
# Trigger: Actions → "CI Live — OrderFlow" → Run workflow (workflow_dispatch).
# NEVER runs on push/PR: it boots real Postgres/Redis/RabbitMQ via
# Testcontainers and runs the full OrderFlowTests class, which needs Docker
# AND time (several minutes on ubuntu-latest; longer on a cold runner).
#
# Requirements on the runner / locally:
#   - Docker daemon available (Testcontainers talks to it directly)
#   - dotnet SDK 10.0.x
#   - Patience: integration suite pulls 3 images on first run
#
# Local equivalent:
#   dotnet test tests/IntegrationTests/FlashSale.IntegrationTests.csproj \
#     --filter "FullyQualifiedName~OrderFlowTests" -v normal
# =============================================================================
name: CI Live — OrderFlow (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-live-orderflow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  order-flow-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: OrderFlowTests (Testcontainers — needs Docker + time)
        run: >
          dotnet test tests/IntegrationTests/FlashSale.IntegrationTests.csproj
          --filter "FullyQualifiedName~OrderFlowTests"
          -v normal --logger trx --results-directory ./test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orderflow-live-results
          path: test-results/
          if-no-files-found: ignore
