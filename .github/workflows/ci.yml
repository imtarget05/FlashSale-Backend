name: FlashSale CI (DevSecOps)

# Phase 5: one PR pipeline proving build, tests, security scanning and container
# builds on every change. The concurrency harness is the original Phase 1-3
# evidence (inventory conservation under concurrent purchase) kept alive.
#
# Jobs:
#   build-and-unit        dotnet build + unit tests + NuGet audit
#   integration-tests     Testcontainers (real Postgres/Redis/RabbitMQ)
#   opsbridge-tests       OpsBridge unit + contract + integration (68+ tests)
#   concurrency-harness   50 buyers vs stock 10 — oversell must not happen
#   security-scan         Trivy fs (vuln + secret + IaC misconfig)
#   docker-build-scan     build API+worker images, Trivy image scan
#   sonarqube             Sonar analysis + QUALITY GATE (needs SONAR_TOKEN;
#                         skipped with an explicit log line until configured)
#   manifest-validation   renders the prod overlay, asserts it is deployable
#   ci-gate               single aggregate check for branch protection

on:
  push:
    branches: [main]
  pull_request:
  # The release-push job's condition explicitly honours workflow_dispatch as a
  # forced-release path, so the trigger has to exist here for that to be true.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build AzureFlashSale.slnx
      - name: Unit tests (use cases + architecture guards)
        run: >
          dotnet test tests/UnitTests/FlashSale.UnitTests.csproj
          --no-build -v normal --logger trx --results-directory ./test-results
          --collect:"XPlat Code Coverage"
      # Re-verified 2026-10-19 on fd7eb3e (SDK 10.0.400): 172/172 PASS.
      # The earlier "161/162 red" state was fixed in 66dca40. A fail-under
      # threshold is still NOT set — enabling one is a separate decision that
      # needs a measured coverage baseline, not a guess.
      - name: Coverage report (artifact only, no threshold)
        if: always()
        run: |
          echo "Coverage files (if any):"
          find tests/UnitTests/TestResults -name 'coverage.cobertura.xml' 2>/dev/null || echo "(none — test run failed before collect)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-cobertura
          path: tests/UnitTests/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
      - name: NuGet audit (no vulnerable packages, transitive included)
        run: |
          set -o pipefail
          fail=0
          for csproj in $(find src tests -name '*.csproj' -not -path '*/obj/*'); do
            echo "== $csproj =="
            dotnet list "$csproj" package --vulnerable --include-transitive || fail=1
          done
          exit $fail
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: test-results/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # ADDITIVE hardening (2026-09-27): dotnet format gate.
  # ADVISORY ONLY (continue-on-error: true, NOT in ci-gate needs, never blocks).
  # Local verification on SDK 10.0.401: DIRTY — 1/171 files would be formatted
  # (tests/UnitTests/EndpointAuthorizationGuardTests.cs, xUnit2031 analyzer:
  # "Do not use a Where clause to filter before calling Assert.Single").
  # New property-test files belong to Phase 2, so CI must not auto-fix and
  # must not block on formatting drift. This job reports only.
  # ---------------------------------------------------------------------------
  format-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: dotnet format --verify-no-changes (advisory, see comment above)
        run: dotnet format AzureFlashSale.slnx --verify-no-changes --verbosity minimal

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # Testcontainers talks to the runner's Docker daemon (present on
      # ubuntu-latest); it boots real Postgres/Redis/RabbitMQ per fixture.
      - name: "Integration tests (Testcontainers: Postgres + Redis + RabbitMQ)"
        run: >
          dotnet test tests/IntegrationTests/FlashSale.IntegrationTests.csproj
          -v normal --logger trx --results-directory ./test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: test-results/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # OpsBridge bounded-context suites. Added 2026-10-19 after AI-0 found that
  # OpsBridge had 70 green tests locally while CI referenced none of them:
  # `dotnet build AzureFlashSale.slnx` compiled the projects but every gate
  # below only ran the FlashSale suites. A green workflow therefore proved
  # nothing about OpsBridge. This job closes that gap and is wired into ci-gate.
  #
  # Local evidence at fd7eb3e (SDK 10.0.400, 2026-10-19):
  #   OpsBridge.UnitTests          41/41 PASS
  #   OpsBridge.ContractTests       7/7  PASS
  #   OpsBridge.IntegrationTests   22/22 PASS (Testcontainers)
  # ---------------------------------------------------------------------------
  opsbridge-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build OpsBridge solution
        run: dotnet build OpsBridge.slnx
      - name: OpsBridge unit tests
        run: >
          dotnet test tests/OpsBridge.UnitTests/OpsBridge.UnitTests.csproj
          --no-build -v normal --logger trx --results-directory ./test-results/opsbridge
      - name: OpsBridge contract tests
        run: >
          dotnet test tests/OpsBridge.ContractTests/OpsBridge.ContractTests.csproj
          --no-build -v normal --logger trx --results-directory ./test-results/opsbridge
      # Testcontainers needs the runner's Docker daemon (present on ubuntu-latest)
      # and boots real Postgres per fixture, exactly as the local run above did.
      - name: "OpsBridge integration tests (Testcontainers: Postgres)"
        run: >
          dotnet test tests/OpsBridge.IntegrationTests/OpsBridge.IntegrationTests.csproj
          --no-build -v normal --logger trx --results-directory ./test-results/opsbridge
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opsbridge-test-results
          path: test-results/opsbridge/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # OpsBridge browser journey (Playwright). Added 2026-10-20 after AI-0 found the
  # other half of the REQ-17 gap: `src/OpsBridge.Web/playwright.config.ts` and a
  # spec existed, but NO CI job ever executed them — the journey had never run,
  # so it proved nothing. 881 unit/integration tests were green while not a
  # single test went from a click in the browser to a row in PostgreSQL.
  #
  # This job closes that gap: real API, real PostgreSQL (a service container,
  # the same postgres:15-alpine image the integration suites use), real browser.
  # It is wired into ci-gate, so a red journey blocks the PR.
  #
  # Design notes that are load-bearing, not decoration:
  #   * The schema is applied with the `--migrate` deployment entrypoint
  #     (ADR-018, commit a1025cb) — never with EnsureCreated. The entrypoint
  #     runs BEFORE the JWT gate, so it needs only the connection string and no
  #     signing key, and it is exactly what a deployment would do.
  #   * ASPNETCORE_ENVIRONMENT=Development is required: the demo login endpoint
  #     (POST /api/v1/auth/login) is only mapped in Development/Test
  #     (src/OpsBridge.Api/Endpoints/AuthEndpoints.cs). A production-shaped
  #     journey would need a real identity provider.
  #   * The API listens on 127.0.0.1:5000 because the Vite dev server proxies
  #     /api to http://127.0.0.1:5000 (src/OpsBridge.Web/vite.config.ts) and
  #     Playwright's webServer starts that dev server on 127.0.0.1:5173. The
  #     proxy target is the literal IPv4 address on purpose: "localhost" can
  #     resolve to the IPv6 loopback, and on macOS the AirPlay receiver owns
  #     [::1]:5000 - which is why the job used to need
  #     NODE_OPTIONS=--dns-result-order=ipv4first to make the hop work at all.
  # ---------------------------------------------------------------------------
  opsbridge-web-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same image as the integration suites / the concurrency harness.
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: OpsBridgeDb
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d OpsBridgeDb"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Only PostgreSQL is needed: the OpsBridge DI registers repositories and
      # the messaging provider is not registered at all.
      ConnectionStrings__OpsBridgeDb: Host=localhost;Port=5432;Database=OpsBridgeDb;Username=postgres;Password=postgres
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://127.0.0.1:5000
    steps:
      # Pin the exact commit under test instead of the merge commit: the job
      # must prove the PR head, not whatever the merge result happens to be.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record the commit under test
        run: |
          echo "### OpsBridge browser journey (Playwright)" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit under test: \`$(git rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- requested ref: \`${{ github.event.pull_request.head.sha || github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: \`OpsBridge.Api\` (Release, Development, 127.0.0.1:5000)" >> "$GITHUB_STEP_SUMMARY"
          echo "- database: \`OpsBridgeDb\` on postgres:15-alpine (fresh per run)" >> "$GITHUB_STEP_SUMMARY"
      # Node version taken from the repository's own engine constraint:
      # src/OpsBridge.Web/package-lock.json pins vite 8 / @vitejs/plugin-react 6 /
      # oxlint to "node": "^20.19.0 || >=22.12.0" — Node 22 (LTS) satisfies it.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/OpsBridge.Web/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build OpsBridge.Api (Release)
        run: dotnet build src/OpsBridge.Api/OpsBridge.Api.csproj -c Release
      - name: Apply the schema with the --migrate entrypoint (ADR-018)
        # Exit codes: 0 = applied or already at head, 1 = failure, 2 = drift.
        run: dotnet src/OpsBridge.Api/bin/Release/net10.0/OpsBridge.Api.dll --migrate
      - name: Start the API in the background
        run: |
          nohup dotnet src/OpsBridge.Api/bin/Release/net10.0/OpsBridge.Api.dll > api.log 2>&1 &
          echo $! > api.pid
      - name: Wait for /healthz (bounded retries, never a fixed sleep)
        # The first request to a cold .NET process pays the JIT cost (measured:
        # ~9.5 s for the very first /healthz), so the COLD-START BUDGET in the
        # script is 30 s - about 3x the measured value, which still leaves room
        # on a loaded runner and still fails a cold start that regressed to
        # 60 s. The old inline version used `curl --max-time 120`, so such a
        # regression was accepted here and only surfaced later as a confusing
        # timeout inside the browser run.
        run: |
          if ! bash scripts/opsbridge-wait-for-api.sh; then
            echo "::group::api.log"
            tail -80 api.log || true
            echo "::endgroup::"
            exit 1
          fi
      - name: Warm the API before the browser run
        # The first request per code path pays JIT + EF query compilation. The
        # existing spec asserts the post-login URL with Playwright's default 5 s
        # expectation timeout, so that cost has to be paid HERE (in the job, with
        # no assertion attached) instead of inside the browser run.
        #
        # The script also owns the BUDGETS (per request and for the whole
        # phase) and fails the job with a diagnostic when they are exceeded -
        # a cold start that regressed to 60 s used to pass the warm-up (the
        # old curl timeout was 120 s) and then failed the browser run with a
        # confusing timeout instead of the real diagnosis. The budgets and
        # their reasoning are documented in scripts/opsbridge-warmup-api.sh.
        run: bash scripts/opsbridge-warmup-api.sh
      - name: Install the web dependencies
        working-directory: src/OpsBridge.Web
        run: npm ci
      - name: Type-check the Playwright specs
        # The specs used to belong to NO tsconfig: tsconfig.app.json included
        # only `src` and tsconfig.node.json only `vite.config.ts`, so
        # `npm run build` never type-checked e2e/ and Playwright's esbuild
        # transpile ignores type errors - a type error in a spec would have
        # shipped silently. tsconfig.e2e.json now owns e2e/ + playwright.config.ts
        # and is referenced from tsconfig.json, so `npm run build` covers it
        # too; this step makes the intent explicit and fails fast.
        working-directory: src/OpsBridge.Web
        run: npm run typecheck:e2e
      - name: Build the web app (tsc -b && vite build)
        # The frontend had no build gate in CI at all: no other job compiles
        # src/OpsBridge.Web. The browser journey below runs the dev server, so a
        # broken build would otherwise only surface as a confusing test failure.
        working-directory: src/OpsBridge.Web
        run: npm run build
      - name: Install the Playwright browser (chromium)
        working-directory: src/OpsBridge.Web
        run: npx playwright install --with-deps chromium
      - name: Run the browser journey
        # --workers=1: the runner's CPU is shared with the API and the database,
        # and the existing spec asserts the post-login URL with a 5 s timeout.
        # --reporter=html,line writes the HTML report into playwright-report/ so
        # the artefact below contains the failure detail.
        # NO NODE_OPTIONS=--dns-result-order=ipv4first any more: the Vite dev
        # server proxies /api to http://127.0.0.1:5000 (the literal IPv4
        # address, see vite.config.ts), so the hop no longer depends on the
        # resolver preferring IPv4. With the old "localhost" target the hop
        # only worked on a runner where "localhost" happened to resolve to
        # IPv4 - on macOS the AirPlay receiver owns [::1]:5000, and the flag
        # was load-bearing there (4/4 tests failed without it).
        working-directory: src/OpsBridge.Web
        run: npx playwright test --workers=1 --reporter=html,line
      - name: Upload the Playwright report, traces and the API log
        # always(): a red journey is only diagnosable with its artefacts.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opsbridge-web-e2e
          path: |
            src/OpsBridge.Web/playwright-report/
            src/OpsBridge.Web/test-results/
            api.log
          if-no-files-found: warn
          retention-days: 14
      - name: Stop the API
        # always(): no orphan process may hold the runner.
        if: always()
        run: |
          if [ -f api.pid ]; then
            kill "$(cat api.pid)" 2>/dev/null || true
            wait "$(cat api.pid)" 2>/dev/null || true
            rm -f api.pid
          fi

  # ---------------------------------------------------------------------------
  # OpsBridge FULL-STACK smoke (containers, through the real reverse proxy).
  # Added 2026-10-21 after the `opsbridge-web-e2e` job above had proved that
  # the web tier works - but only behind `npm run dev`, with VITE proxying
  # /api to the API. The DEPLOYED artefact of the web tier had never been
  # built, let alone run: a built static bundle has no /api proxy at all, so
  # there was no way to deploy the web tier and have it reach the API. This
  # job closes that gap and is wired into ci-gate.
  #
  # It is the same journey as the job above - the same specs, unchanged - but
  # the whole stack runs in CONTAINERS and the browser talks to nginx:
  #
  #   postgres:15-alpine  ->  OpsBridge.Api (container)  ->  nginx (container)
  #                                                        ->  Chromium
  #
  # Design notes that are load-bearing, not decoration:
  #   * The web container runs with the MANIFEST's security context and the
  #     manifest's volume mounts: --read-only (readOnlyRootFilesystem: true),
  #     --user 1654:1654 (runAsUser/runAsGroup: 1654), --cap-drop ALL
  #     (capabilities.drop: [ALL]), --security-opt no-new-privileges
  #     (allowPrivilegeEscalation: false) and the THREE emptyDir-equivalent
  #     tmpfs mounts of infrastructure/kubernetes/base/opsbridge-web/
  #     deployment.yaml (/tmp/nginx/conf.d, /tmp/nginx/cache, /tmp/nginx/run).
  #     /tmp is deliberately NOT mounted wholesale: that replaces the image's
  #     whole /tmp tree, and with it the three directories the image creates
  #     and chowns to uid 1654. The job rehearses the MANIFEST, not the image.
  #   * API_UPSTREAM points at the API CONTAINER, not at 127.0.0.1: the browser
  #     reaches the API through nginx, and nginx reaches the API over the
  #     docker network. The PORT is the container port (8080), which is the
  #     right one for a Docker-to-Docker hop; the Kubernetes manifest uses the
  #     SERVICE port (80), because a ClusterIP only answers the ports its
  #     Service declares. PLAYWRIGHT_BASE_URL points at the published port of
  #     the web container, and playwright.config.ts then SKIPS the Vite
  #     dev server entirely - so the journey cannot accidentally be proven
  #     against the dev server again.
  #   * The schema is applied with the --migrate deployment entrypoint
  #     (ADR-018), against the very image that then serves the API.
  #   * ASPNETCORE_ENVIRONMENT=Development is required: the demo login
  #     endpoint (POST /api/v1/auth/login) is mapped only in
  #     Development/Test (src/OpsBridge.Api/Endpoints/AuthEndpoints.cs).
  # ---------------------------------------------------------------------------
  opsbridge-stack-smoke:
    runs-on: ubuntu-latest
    env:
      # The network the three containers share. The API is reached by its
      # container name, exactly like the Kubernetes Service.
      STACK_NETWORK: opsbridge-stack
      PG_CONTAINER: opsbridge-stack-pg
      API_CONTAINER: opsbridge-stack-api
      WEB_CONTAINER: opsbridge-stack-web
      PG_PORT: '55432'
      API_PORT: '15000'
      WEB_PORT: '18080'
      DB_NAME: OpsBridgeDb
      DB_USER: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record the commit under test
        run: |
          echo "### OpsBridge full-stack smoke (containers)" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit under test: \`$(git rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- web image: \`opsbridge-web:stack-smoke\` (nginx, port 8080, uid 1654)" >> "$GITHUB_STEP_SUMMARY"
          echo "- API image: \`opsbridge-api:stack-smoke\` (Release, Development)" >> "$GITHUB_STEP_SUMMARY"
          echo "- database: postgres:15-alpine, schema applied with \`--migrate\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- browser base URL: \`http://127.0.0.1:${{ env.WEB_PORT }}\` (the containerised web, NOT the dev server)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/OpsBridge.Web/package-lock.json
      - name: Build the API image
        # The same artefact the migration Job and the Deployment use.
        run: docker build -f Dockerfile.opsbridge -t opsbridge-api:stack-smoke .
      - name: Build the web image
        # The artefact the Kubernetes manifest of the web tier pulls.
        run: docker build -f Dockerfile.web -t opsbridge-web:stack-smoke .
      - name: Assert the image contract the Kubernetes manifest builds against
        # The manifest of the web tier is owned by another slice; this step is
        # the contract between the two, asserted on every run.
        run: |
          set -euo pipefail
          uid=$(docker run --rm --entrypoint id opsbridge-web:stack-smoke | sed -n 's/^uid=\([0-9]*\).*/\1/p')
          echo "web image uid: ${uid}"
          [ "${uid}" = "1654" ] || { echo "FAIL: the web image must run as uid 1654"; exit 1; }
          docker image inspect opsbridge-web:stack-smoke --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | grep -qx 'API_UPSTREAM=http://opsbridge-api:8080' \
            || { echo "FAIL: the default API_UPSTREAM changed"; exit 1; }
          docker image inspect opsbridge-web:stack-smoke --format '{{.Config.Healthcheck.Test}}' \
            | grep -q '/healthz' \
            || { echo "FAIL: the healthcheck must probe /healthz"; exit 1; }
          docker image inspect opsbridge-web:stack-smoke --format '{{.Config.ExposedPorts}}' \
            | grep -q '8080/tcp' \
            || { echo "FAIL: the web image must expose 8080"; exit 1; }
      - name: Start PostgreSQL
        run: |
          set -euo pipefail
          docker network create "${STACK_NETWORK}"
          docker run -d --name "${PG_CONTAINER}" --network "${STACK_NETWORK}" \
            -e POSTGRES_USER="${DB_USER}" -e POSTGRES_PASSWORD="${DB_PASSWORD}" -e POSTGRES_DB="${DB_NAME}" \
            -p "${PG_PORT}:5432" postgres:15-alpine
          # Bounded wait, never a fixed sleep: the migration below refuses to
          # run against a database that is not there yet.
          for i in $(seq 1 60); do
            if docker exec "${PG_CONTAINER}" pg_isready -U "${DB_USER}" -d "${DB_NAME}" >/dev/null 2>&1; then
              echo "postgres ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "FAIL: postgres never became ready"; docker logs "${PG_CONTAINER}"; exit 1
      - name: Apply the schema with the --migrate entrypoint (ADR-018)
        # Exit codes: 0 = applied or already at head, 1 = failure, 2 = drift.
        run: |
          set -euo pipefail
          docker run --rm --network "${STACK_NETWORK}" \
            -e "ConnectionStrings__OpsBridgeDb=Host=${PG_CONTAINER};Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}" \
            opsbridge-api:stack-smoke --migrate
      - name: Generate a real JWT signing key for this run
        # The API SIGNS with the configured key as well as VALIDATING with it:
        # OpsBridgeJwtConfiguration (src/OpsBridge.Infrastructure/Security/)
        # is the single reader of Jwt:SigningKey / Jwt:Issuer / Jwt:Audience,
        # and it is read ONCE into a frozen snapshot (OpsBridgeJwtSettings)
        # that both the issuer (DependencyInjection.cs) and the validation
        # path (src/OpsBridge.Api/Program.cs) are handed. One snapshot, two
        # consumers: the two sides cannot drift apart.
        #
        # Before that, the issuer was registered with NO configuration and
        # always signed with the built-in development key, while Program.cs
        # validated with the CONFIGURED key. In Production the two cannot be
        # equal (Program.cs refuses the built-in key there), so every token
        # the API issued was rejected by the API itself: IDX10517 -> 401 on
        # every login. This job used to work around that by reading the
        # built-in key out of the SOURCE at run time - which hid the defect
        # behind a key that no deployment would ever use.
        #
        # The workaround is gone. The key below is a REAL one, generated per
        # run, at least 32 bytes long and NOT the built-in development key -
        # so this job now fails if the API ever signs with anything other than
        # the key it validates with. It is generated rather than written as a
        # literal, so no secret ends up in the workflow file (the Trivy secret
        # scanner of the security-scan job would eventually flag a literal).
        run: |
          set -euo pipefail
          key="$(openssl rand -base64 48 | tr -d '\n')"
          [ "${#key}" -ge 32 ] || { echo "FAIL: the generated signing key is shorter than 32 bytes"; exit 1; }
          case "${key}" in
            *OpsBridge-Secret-Key-Must-Be-At-Least-32-Bytes-Long-For-HMAC-SHA256\!) echo "FAIL: the generated key is the built-in development key"; exit 1;;
          esac
          echo "JWT_SIGNING_KEY=${key}" >> "$GITHUB_ENV"
      - name: Start the API container
        run: |
          set -euo pipefail
          # --network-alias opsbridge-api: the API answers on the SAME DNS name
          # the Kubernetes manifest uses (the API Service's name). The only
          # difference is the PORT, and that difference is the whole point:
          #
          #   * here the upstream is the API CONTAINER, so it is reachable on
          #     the port the container LISTENS on (8080 - Dockerfile.opsbridge
          #     exposes 8080). Docker-to-Docker.
          #   * in Kubernetes the upstream is the API ClusterIP SERVICE, and a
          #     ClusterIP only answers the ports its Service DECLARES -
          #     Service/opsbridge-api declares `port: 80` -> targetPort 8080.
          #     So the manifest's API_UPSTREAM is http://opsbridge-api:80.
          #
          # The image's own default (http://opsbridge-api:8080) is the
          # CONTAINER port, which is why the manifest sets the variable
          # explicitly. The validator (rule 10p) asserts that the manifest's
          # port is the Service's port.
          docker run -d --name "${API_CONTAINER}" --network "${STACK_NETWORK}" \
            --network-alias opsbridge-api -p "${API_PORT}:8080" \
            -e "ConnectionStrings__OpsBridgeDb=Host=${PG_CONTAINER};Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}" \
            -e "Jwt__SigningKey=${JWT_SIGNING_KEY}" \
            -e "Jwt__Issuer=OpsBridge.Api" \
            -e "Jwt__Audience=OpsBridge.Web" \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e ASPNETCORE_URLS=http://+:8080 \
            opsbridge-api:stack-smoke
          for i in $(seq 1 90); do
            if curl -sf -m 3 "http://127.0.0.1:${API_PORT}/healthz" >/dev/null 2>&1; then
              echo "api healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "FAIL: the API never became healthy"; docker logs "${API_CONTAINER}"; exit 1
      - name: Start the web container (nginx in front of the API)
        # THE MANIFEST, REHEARSED. Not the image's own layout: this container
        # runs with the security context and the volume mounts of
        # infrastructure/kubernetes/base/opsbridge-web/deployment.yaml, so the
        # merge of the two halves is proven here instead of in a cluster.
        #
        #   --read-only                    <- readOnlyRootFilesystem: true
        #   --user 1654:1654               <- runAsUser / runAsGroup: 1654
        #   --cap-drop ALL                 <- capabilities.drop [ALL]
        #   --security-opt no-new-privileges <- allowPrivilegeEscalation: false
        #   --tmpfs <the three paths>      <- the three emptyDir volumes
        #
        # The three tmpfs mounts are the ones the IMAGE declares (the writable
        # paths it creates and chowns to uid 1654):
        #   /tmp/nginx/conf.d  the rendered server block
        #   /tmp/nginx/cache   the nginx temp directories
        #   /tmp/nginx/run     the pid file
        # /tmp is deliberately NOT mounted wholesale: that would replace the
        # image's whole /tmp tree and take the three directories with it.
        # The tmpfs options (uid/gid/mode) stand in for the manifest's
        # fsGroup: 1654, which is what makes an emptyDir group-writable.
        run: |
          set -euo pipefail
          docker run -d --name "${WEB_CONTAINER}" --network "${STACK_NETWORK}" -p "${WEB_PORT}:8080" \
            --read-only \
            --user 1654:1654 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp/nginx/conf.d:uid=1654,gid=1654,mode=0770 \
            --tmpfs /tmp/nginx/cache:uid=1654,gid=1654,mode=0770 \
            --tmpfs /tmp/nginx/run:uid=1654,gid=1654,mode=0770 \
            -e "API_UPSTREAM=http://opsbridge-api:8080" \
            opsbridge-web:stack-smoke
          for i in $(seq 1 60); do
            if curl -sf -m 3 "http://127.0.0.1:${WEB_PORT}/healthz" >/dev/null 2>&1; then
              echo "web healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "FAIL: the web container never became healthy"; docker logs "${WEB_CONTAINER}"; exit 1
      - name: Install the web dependencies
        working-directory: src/OpsBridge.Web
        run: npm ci
      - name: Assert the image/manifest volume contract
        # The control that stops the image and the manifest from drifting
        # apart: the contract test reads Dockerfile.web, works out which
        # paths the image creates and owns, and fails when the Deployment's
        # mountPaths are not exactly that set (in either direction).
        #
        # This is the test that would have caught the first version of the
        # web manifest, which mounted /var/cache/nginx, /var/run and /tmp
        # instead of the three paths the image declares.
        working-directory: src/OpsBridge.Web
        run: npm run test:contract
      - name: Type-check the Playwright specs
        working-directory: src/OpsBridge.Web
        run: npm run typecheck:e2e
      - name: Install the Playwright browser (chromium)
        working-directory: src/OpsBridge.Web
        run: npx playwright install --with-deps chromium
      - name: Run the browser journey against the containerised stack
        # PLAYWRIGHT_BASE_URL makes playwright.config.ts skip the Vite dev
        # server: the browser talks to the published port of the WEB
        # CONTAINER, and every /api request goes through nginx.
        # STACK_SMOKE_DATABASE_URL lets the new spec read the row the browser
        # wrote straight out of PostgreSQL.
        # --workers=1: the runner's CPU is shared with the API and the
        # database, and the existing spec asserts the post-login URL with a
        # 5 s timeout.
        working-directory: src/OpsBridge.Web
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:${{ env.WEB_PORT }}
          STACK_SMOKE_DATABASE_URL: postgresql://${{ env.DB_USER }}:${{ env.DB_PASSWORD }}@127.0.0.1:${{ env.PG_PORT }}/${{ env.DB_NAME }}
        run: npx playwright test --workers=1 --reporter=html,line
      - name: Collect the container logs
        # always(): a red journey is only diagnosable with the logs of the
        # containers it ran against.
        if: always()
        run: |
          mkdir -p stack-logs
          docker logs "${WEB_CONTAINER}" > stack-logs/web.log 2>&1 || true
          docker logs "${API_CONTAINER}" > stack-logs/api.log 2>&1 || true
          docker logs "${PG_CONTAINER}"   > stack-logs/postgres.log 2>&1 || true
          # The nginx access log IS the evidence that the journey went through
          # the reverse proxy: every /api/v1/... line is a request the browser
          # made to the web container.
          grep -E '"(GET|POST) /api' stack-logs/web.log | tail -40 > stack-logs/web-api-access.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opsbridge-stack-smoke
          path: |
            src/OpsBridge.Web/playwright-report/
            src/OpsBridge.Web/test-results/
            stack-logs/
          if-no-files-found: warn
          retention-days: 14
      - name: Tear the stack down (no orphan container may hold the runner)
        if: always()
        run: |
          docker rm -f "${WEB_CONTAINER}" "${API_CONTAINER}" "${PG_CONTAINER}" 2>/dev/null || true
          docker network rm "${STACK_NETWORK}" 2>/dev/null || true

  concurrency-harness:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: FlashSaleDb
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build AzureFlashSale.slnx
      - name: Install psql client (audit tooling for the harness)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Mint a throwaway ops credential for this run
        # The harness calls POST /internal/resync-stock, which is STAFF/ADMIN
        # only. The password is generated per run so nothing reusable is ever
        # committed, and the API seeds its STAFF account from it.
        run: |
          set -euo pipefail
          python3 -c 'import secrets; print(secrets.token_urlsafe(24))' > ops-password.txt
          echo "::add-mask::$(cat ops-password.txt)"
          echo "OPS_STAFF_PASSWORD=$(cat ops-password.txt)" >> "$GITHUB_ENV"
      - name: Start API in background
        run: |
          # ADR-005 as corrected in 7C: nothing configured no longer silently
          # falls back to InMemory — it throws. The harness is a SINGLE process
          # (accept + consume inside one API instance), which is exactly the
          # sanctioned InMemory use case, so it opts in EXPLICITLY here.
          # First run after the guard landed (35737398203) failed exactly there:
          # the API died on MessagingConfigurationException, the old wait loop
          # exited 0 anyway, and the real failure surfaced downstream as
          # 'relation "Products" does not exist' — a misleading symptom.
          # ASPNETCORE_ENVIRONMENT is also explicit instead of relying on
          # launchSettings being honoured in CI.
          Messaging__Provider=InMemory \
          ASPNETCORE_ENVIRONMENT=Development \
          Bootstrap__StaffPassword="$OPS_STAFF_PASSWORD" \
          nohup dotnet run --project src/Order.Api --urls http://localhost:5065 > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5065/healthz && break; sleep 1; done
          # Fail HERE if the API never came up, so a startup crash reports as a
          # startup crash (api.log holds the real exception) instead of a
          # missing-table error in the harness step.
          curl -sf http://localhost:5065/healthz \
            || { echo "API did not become healthy; api.log:"; tail -40 api.log; exit 1; }
      - name: Log in as the seeded STAFF account
        # Without this the harness cannot call the resync runbook, Redis would keep
        # the pre-test stock counter, and the audit would measure the wrong number
        # while still reporting PASS.
        run: |
          set -euo pipefail
          login=""
          for i in $(seq 1 30); do
            login=$(curl -sf -X POST http://localhost:5065/api/auth/login \
              -H 'Content-Type: application/json' \
              -d "{\"email\":\"staff@flashsale.local\",\"password\":\"$OPS_STAFF_PASSWORD\"}" || true)
            [ -n "$login" ] && break
            sleep 1
          done
          token=$(printf '%s' "$login" | python3 -c 'import json,sys; print(json.load(sys.stdin)["accessToken"])')
          echo "::add-mask::$token"
          echo "OPS_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Concurrency harness — exact fill and inventory conservation
        run: |
          set -euo pipefail
          python3 -m unittest discover -s load-tests/concurrency -p 'test_oversell_demo.py'
          python3 load-tests/concurrency/oversell_demo.py \
            --stock 10 --requests 50 --psql-container '' --settle-seconds 3 \
            --ops-token "$OPS_TOKEN" | tee result.txt
          grep -q "RESULT: PASS" result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-result
          path: |
            result.txt
            api.log
          if-no-files-found: ignore

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # vuln + secret + IaC misconfig on the whole checkout; HIGH+ fails the PR.
      # Local TF state is never committed (*.tfstate* ignored) but the skip keeps
      # the scan deterministic; .env is a git-ignored dev file.
      - name: Trivy fs — vulnerabilities, secrets and IaC misconfig (HIGH+ blocks)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          skip-files: '*.tfstate*,.env'
      - name: Trivy config — Dockerfile / Terraform / Kubernetes IaC
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          severity: HIGH,CRITICAL
          exit-code: '1'

  docker-build-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build order-api image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: flashsale/order-api:ci-${{ github.sha }}
      - name: Build order-worker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.worker
          push: false
          load: true
          tags: flashsale/order-worker:ci-${{ github.sha }}
      - name: Build payment-service image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.payment
          push: false
          load: true
          tags: flashsale/payment-service:ci-${{ github.sha }}
      - name: Trivy image scan — order-api (HIGH+ blocks)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: flashsale/order-api:ci-${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - name: Trivy image scan — order-worker (HIGH+ blocks)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: flashsale/order-worker:ci-${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - name: Trivy image scan — payment-service (HIGH+ blocks)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: flashsale/payment-service:ci-${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  sonarqube:
    # Explicitly enabled with a repo variable, because SonarCloud blocks CI
    # analysis while "Automatic Analysis" is on for the project (an org/UI
    # setting that the API refuses to change: project-level sonar.automatic.analysis
    # reads back false but the analysis is still refused). Flip it in the UI
    # (SonarCloud → project → Administration → Analysis Method → CI-based
    # analysis), then:  gh variable set SONAR_ENABLED --body true
    # Until then the quality gate is NOT enforced and is not claimed to be.
    if: vars.SONAR_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Java 17 is required by the Sonar scanner for .NET
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: SonarQube analysis + quality gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "SKIP: SONAR_TOKEN is not configured on this repository yet."
            echo "Quality gate is NOT enforced in CI. Enable steps are documented in"
            echo "docs/evidence/ci/phase5-devsecops-pipeline.md (SonarCloud token +"
            echo "'gh secret set SONAR_TOKEN'). Until then Trivy + NuGet audit carry"
            echo "the security evidence and this job reports itself as skipped."
            exit 0
          fi
          dotnet tool install --global dotnet-sonarscanner
          dotnet sonarscanner begin \
            /k:"imtarget05_FlashSale-Backend" \
            /o:"imtarget05" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /d:sonar.cs.vstest.reportsPaths="**/*.trx" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.qualitygate.timeout=600
          dotnet build AzureFlashSale.slnx
          dotnet test AzureFlashSale.slnx --no-build -v q \
            --logger trx --results-directory ./test-results
          dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

  detect-changes:
    # Docs-only commits must not mint a new runtime image (same hardening P02
    # applies; P01's Phase 6 first shipped without it, so a docs-only commit
    # rebuilt the images and moved the GitOps SHA — closed here).
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.filter.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect runtime vs docs-only change
        id: filter
        run: |
          BASE="${{ github.event.before }}"
          [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] || BASE="HEAD~1"
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          echo "changed files:"; echo "$CHANGED"
          # runtime = anything that is not a docs/markdown-only path
          if echo "$CHANGED" | grep -qvE '^(README\.md$|docs/|.*\.md$)'; then
            echo "runtime=true" >> "$GITHUB_OUTPUT"
          else
            echo "runtime=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Phase 6 — Release engineering (only on main, only after the CI gate passes)
  # ---------------------------------------------------------------------------
  release-push:
    needs: [ci-gate, detect-changes]
    # Publish only artefact-changing commits; docs-only commits run CI checks but
    # mint no image and move no GitOps SHA. workflow_dispatch can force a release.
    #
    # vars.AZURE_RELEASE_ENABLED is a deliberate kill switch, mirroring the
    # vars.SONAR_ENABLED gate on the sonarqube job: the Azure OIDC app
    # registration is not provisioned in the current tenant (AADSTS700016,
    # run 39371950228), so until the variable is set to 'true' this job and
    # gitops-update are skipped instead of going red on an environment that is
    # not wired up. The code gates in ci-gate are unaffected.
    if: >-
      vars.AZURE_RELEASE_ENABLED == 'true' &&
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.ref == 'refs/heads/main' && github.event_name == 'push' &&
        needs.detect-changes.outputs.runtime == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # required for the OIDC token exchange
    outputs:
      image_api: ${{ steps.tags.outputs.api }}
      image_worker: ${{ steps.tags.outputs.worker }}
      digest_api: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      # Workload identity federation: no ACR password / client secret anywhere.
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Log in to ACR with the federated identity
        run: az acr login --name ${{ vars.ACR_NAME }}
      - name: Compute immutable tags
        id: tags
        run: |
          echo "api=${{ vars.ACR_LOGIN_SERVER }}/order-api:${GITHUB_SHA}"     >> "$GITHUB_OUTPUT"
          echo "worker=${{ vars.ACR_LOGIN_SERVER }}/order-worker:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "payment=${{ vars.ACR_LOGIN_SERVER }}/payment-service:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build and push order-api:<sha>
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.api }}
      - name: Build and push order-worker:<sha>
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          tags: ${{ steps.tags.outputs.worker }}
      - name: Build and push payment-service:<sha>
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.payment
          push: true
          tags: ${{ steps.tags.outputs.payment }}
      - name: Verify the pushed tags resolve to digests (immutable artifact exists)
        id: push
        run: |
          API_DIGEST=$(az acr manifest list-metadata --registry ${{ vars.ACR_NAME }} \
            --name order-api --query "[?tags[0]=='${GITHUB_SHA}'].digest | [0]" -o tsv)
          WORKER_DIGEST=$(az acr manifest list-metadata --registry ${{ vars.ACR_NAME }} \
            --name order-worker --query "[?tags[0]=='${GITHUB_SHA}'].digest | [0]" -o tsv)
          PAYMENT_DIGEST=$(az acr manifest list-metadata --registry ${{ vars.ACR_NAME }} \
            --name payment-service --query "[?tags[0]=='${GITHUB_SHA}'].digest | [0]" -o tsv)
          echo "order-api      ${GITHUB_SHA} → ${API_DIGEST}"
          echo "order-worker   ${GITHUB_SHA} → ${WORKER_DIGEST}"
          echo "payment-service ${GITHUB_SHA} → ${PAYMENT_DIGEST}"
          [ -n "$API_DIGEST" ] && [ "$API_DIGEST" != "None" ] || { echo "order-api:$GITHUB_SHA not found in ACR"; exit 1; }
          [ -n "$WORKER_DIGEST" ] && [ "$WORKER_DIGEST" != "None" ] || { echo "order-worker:$GITHUB_SHA not found in ACR"; exit 1; }
          [ -n "$PAYMENT_DIGEST" ] && [ "$PAYMENT_DIGEST" != "None" ] || { echo "payment-service:$GITHUB_SHA not found in ACR"; exit 1; }
          echo "digest=${API_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "worker_digest=${WORKER_DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Summary
        run: |
          echo "### Released artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo "- ${{ steps.tags.outputs.api }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- ${{ steps.tags.outputs.worker }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- ${{ steps.tags.outputs.payment }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- order-api digest: ${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  gitops-update:
    needs: release-push
    # the bot commit from gitops-update must not re-trigger a release build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # the GitOps commit is the deployment contract
    steps:
      - uses: actions/checkout@v4
      # Git state is the desired runtime state (ADR-011). Phase 7 ArgoCD syncs
      # from this commit; nothing is ever kubectl-applied by CI.
      - name: Pin the overlay to the released SHA
        # Logic lives in scripts/gitops-pin-overlay.py rather than an inline
        # heredoc so it can be re-run and unit-tested locally. It pins every
        # first-party image (order-api, order-worker, payment-service) and
        # exits non-zero if any pin did not land — the old inline version
        # matched `- name: <registry>/order-api`,
        # a pattern that stopped existing once base became registry-neutral,
        # and it only ever touched order-api.
        run: >
          ./scripts/gitops-pin-overlay.py
          infrastructure/kubernetes/overlays/prod/kustomization.yaml
          "${{ vars.ACR_LOGIN_SERVER }}" "${GITHUB_SHA}"
      - name: Show the pinning diff
        run: git diff -- infrastructure/kubernetes/overlays/prod/kustomization.yaml
      # The pushed commit IS the deployment contract that ArgoCD will sync, so
      # it has to render before it is pushed. This is the gate that was missing
      # when a green release still produced an un-pullable image reference.
      - name: Validate the rendered prod overlay
        run: ./scripts/validate-manifests.sh
      - name: Commit and push the GitOps bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infrastructure/kubernetes/overlays/prod/kustomization.yaml
          if git diff --cached --quiet; then
            echo "no change (already pinned to ${GITHUB_SHA})"
          else
            git commit -m "gitops: pin prod overlay to ${GITHUB_SHA}"
            git push
          fi
      - name: Summary
        run: |
          echo "### GitOps" >> "$GITHUB_STEP_SUMMARY"
          echo "Desired state committed: prod overlay (order-api + order-worker) -> \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"

  manifest-validation:
    runs-on: ubuntu-latest
    # Renders the prod overlay and asserts the OUTPUT is deployable. This job
    # exists because every other job in this file proves the image, not the
    # desired state: a green release-push + digest verification coexisted with a
    # rendered manifest pointing at a non-existent registry and a mutable
    # `:latest` tag, which no cluster could pull (Phase 7C readiness finding).
    # Needs no cluster and no credentials — kubectl's built-in kustomize is
    # enough, so it runs on forks and on every PR.
    steps:
      - uses: actions/checkout@v4
      # PyYAML is preinstalled on ubuntu-latest, but a gate that silently
      # disappears because an import failed is the exact bug class this job
      # exists to catch — so it is installed explicitly and validated-objects.py
      # exits non-zero if the import is still missing.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: python3 -m pip install --quiet pyyaml
      - name: Render and validate the prod overlay
        run: ./scripts/validate-manifests.sh
      - name: Install kubeconform (the schema validator)
        # The manifest validator above checks the CONTRACT of the manifests
        # (the names, the ports, the mounts, the hardening). It does not check
        # that the manifests are VALID against the Kubernetes schema: a typo
        # in a field name, a wrong type, an unknown key — none of that is
        # visible to a grep. kubeconform is, and a manifest that does not
        # validate is a manifest the API server rejects at apply time.
        #
        # The version is pinned and the download is CHECKSUM-VERIFIED against
        # the release's own CHECKSUMS file: a gate that downloads an
        # unverified binary is a supply-chain hole, not a gate.
        run: |
          set -euo pipefail
          version="v0.8.0"
          asset="kubeconform-linux-amd64.tar.gz"
          base="https://github.com/yannh/kubeconform/releases/download/${version}"
          curl -fsSL -o "/tmp/${asset}" "${base}/${asset}"
          curl -fsSL -o /tmp/CHECKSUMS "${base}/CHECKSUMS"
          # The checksum line names the asset by its bare file name, and
          # `sha256sum --check` resolves it against the CURRENT directory.
          # The archive was downloaded to /tmp, so the check has to run there -
          # otherwise it reports "No such file or directory" for a file that is
          # present, and the gate fails for a reason that has nothing to do with
          # the manifests.
          ( cd /tmp && grep " ${asset}\$" CHECKSUMS | sha256sum --check --strict )
          tar -xzf "/tmp/${asset}" -C /usr/local/bin kubeconform
          kubeconform -v
      - name: Validate the rendered manifests against the schema catalog
        # `-strict` means "no unknown fields": the strict schemas reject a
        # key that does not exist, which is exactly the class of typo a grep
        # cannot see.
        #
        # The Gateway API CRDs (HTTPRoute) are NOT in the Kubernetes schema
        # catalog, so a second schema location is needed — without it
        # kubeconform exits 1 on every HTTPRoute ("could not find schema").
        # The location is PINNED to a commit of the CRD catalog, so the gate
        # cannot start failing (or passing) because an upstream branch moved.
        run: |
          set -euo pipefail
          kubectl kustomize infrastructure/kubernetes/overlays/prod > /tmp/rendered-prod.yaml
          kubectl kustomize infrastructure/kubernetes/base/opsbridge-api > /tmp/rendered-opsbridge-api.yaml
          kubectl kustomize infrastructure/kubernetes/base/opsbridge-web > /tmp/rendered-opsbridge-web.yaml
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/501527ab9c40c827144c8f45945b25a023e344ce/{{ .Group }}/{{ .ResourceKind }}_{{ .ResourceAPIVersion }}.json' \
            /tmp/rendered-prod.yaml \
            /tmp/rendered-opsbridge-api.yaml \
            /tmp/rendered-opsbridge-web.yaml
      - name: Mutation-test the manifest validator
        # A rule that cannot fail documents nothing: every assertion of the
        # validator gets a broken manifest it has to catch. This is what
        # proves the new web rules (the API_UPSTREAM port against the API
        # Service's own port) are real controls and not decoration.
        run: python3 scripts/test-validate-manifests.py

  ci-gate:
    needs:
      - build-and-unit
      - integration-tests
      - opsbridge-tests
      - opsbridge-web-e2e
      - opsbridge-stack-smoke
      - concurrency-harness
      - security-scan
      - docker-build-scan
      - manifest-validation
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Aggregate gate
        run: |
          echo "build-and-unit       = ${{ needs.build-and-unit.result }}"
          echo "integration-tests    = ${{ needs.integration-tests.result }}"
          echo "opsbridge-tests      = ${{ needs.opsbridge-tests.result }}"
          echo "opsbridge-web-e2e    = ${{ needs.opsbridge-web-e2e.result }}"
          echo "opsbridge-stack-smoke = ${{ needs.opsbridge-stack-smoke.result }}"
          echo "concurrency-harness  = ${{ needs.concurrency-harness.result }}"
          echo "security-scan        = ${{ needs.security-scan.result }}"
          echo "docker-build-scan    = ${{ needs.docker-build-scan.result }}"
          echo "manifest-validation  = ${{ needs.manifest-validation.result }}"
          fail=0
          [ "${{ needs.build-and-unit.result }}"      = "success" ] || { echo "GATE FAIL: build-and-unit";      fail=1; }
          [ "${{ needs.integration-tests.result }}"   = "success" ] || { echo "GATE FAIL: integration-tests";   fail=1; }
          [ "${{ needs.opsbridge-tests.result }}"     = "success" ] || { echo "GATE FAIL: opsbridge-tests";     fail=1; }
          [ "${{ needs.opsbridge-web-e2e.result }}"   = "success" ] || { echo "GATE FAIL: opsbridge-web-e2e";   fail=1; }
          [ "${{ needs.opsbridge-stack-smoke.result }}" = "success" ] || { echo "GATE FAIL: opsbridge-stack-smoke"; fail=1; }
          [ "${{ needs.concurrency-harness.result }}" = "success" ] || { echo "GATE FAIL: concurrency-harness"; fail=1; }
          [ "${{ needs.security-scan.result }}"       = "success" ] || { echo "GATE FAIL: security-scan";       fail=1; }
          [ "${{ needs.docker-build-scan.result }}"   = "success" ] || { echo "GATE FAIL: docker-build-scan";   fail=1; }
          [ "${{ needs.manifest-validation.result }}" = "success" ] || { echo "GATE FAIL: manifest-validation"; fail=1; }
          exit $fail
