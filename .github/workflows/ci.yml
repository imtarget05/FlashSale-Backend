name: FlashSale Java CI

on:
  push:
    branches: [main, preview]
  pull_request:
    branches: [main, preview]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: 17

jobs:
  build-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Restore Maven dependencies
        run: mvn -B dependency:go-offline
        working-directory: src/payment-service-java

      - name: Compile
        run: mvn -B compile
        working-directory: src/payment-service-java

      - name: Run unit tests (no Docker)
        run: mvn -B test -Dtest='!*Integration*'
        working-directory: src/payment-service-java

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build-and-unit
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: flashsale
          POSTGRES_PASSWORD: flashsale
          POSTGRES_DB: flashsale
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flashsale -d flashsale"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run integration tests (Testcontainers + service containers)
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/flashsale
          SPRING_DATASOURCE_USERNAME: flashsale
          SPRING_DATASOURCE_PASSWORD: flashsale
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
          SPRING_RABBITMQ_HOST: localhost
          SPRING_RABBITMQ_PORT: 5672
          SPRING_RABBITMQ_USERNAME: guest
          SPRING_RABBITMQ_PASSWORD: guest
          app.jwt.secret: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          demo.auth.password: interview-demo-pass
        run: mvn -B verify
        working-directory: src/payment-service-java

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-and-unit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build payment-service image (no push)
        uses: docker/build-push-action@v6
        with:
          context: src/payment-service-java
          load: true
          tags: flashsale/payment-service:local-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  validate-manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-unit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate k8s manifests (dry-run parse)
        run: |
          set -euo pipefail
          for f in src/payment-service-java/k8s/*.yaml; do
            echo "Validating $f"
            ruby -ryaml -e 'YAML.load_stream(File.read(ARGV.fetch(0)))' "$f"
          done
          echo "All k8s manifests parsed successfully"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.3"

      - name: Validate Terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate -no-color
        working-directory: infrastructure/terraform
