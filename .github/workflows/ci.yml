name: FlashSale Java backend CI

on:
  push:
    branches: [main, preview]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Java backend tests
        working-directory: src/payment-service-java
        run: mvn -q test

      - name: Smoke-check Docker build for Render service
        working-directory: src/payment-service-java
        run: docker build -t flashsale-payment-api:test .

  render-branch-gate:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preview'
    steps:
      - uses: actions/checkout@v4

      - name: Validate Render config for preview/prod branches
        run: |
          ruby - <<'RUBY'
          require 'yaml'
          abort('render.yaml not found') unless File.exist?('render.yaml')
          data = YAML.load_file('render.yaml')
          services = Array(data['services'])
          names = services.map { |s| s['name'] }
          expected = %w[flashsale-payment-api-preview flashsale-payment-api-prod]
          missing = expected - names
          abort("Missing Render service names: #{missing.join(', ')}") unless missing.empty?
          services.each do |svc|
            branch = svc['branch']
            abort("Invalid branch config for #{svc['name']}: #{branch}") unless %w[preview main].include?(branch)
            abort("Health check path mismatch for #{svc['name']}") unless svc['healthCheckPath'] == '/health/live'
          end
          puts 'Render preview/prod config validated successfully.'
          RUBY

      - name: Ensure deployment branch is explicit
        run: |
          echo "Preview branch: preview"
          echo "Production branch: main"
          echo "Service health endpoint: /health/live"
