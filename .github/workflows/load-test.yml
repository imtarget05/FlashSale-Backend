name: Load Test (k6) - Gap G15

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  k6-load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create shared Compose network
        run: docker network inspect portfolio-net >/dev/null 2>&1 || docker network create portfolio-net

      # No explicit -f: compose merges docker-compose.yml + docker-compose.override.yml,
      # so order-api is published on host port 5001 (override pins "5001:8080").
      - name: Start API dependencies (PostgreSQL, Redis, RabbitMQ)
        run: |
          docker compose up -d postgres redis rabbitmq
          sleep 10
          docker compose ps

      - name: Start order-api (runs migrations on boot)
        run: |
          docker compose up -d order-api
          sleep 15
          # Wait for API to be healthy
          for i in {1..30}; do
            if curl -sf http://localhost:5001/health/live >/dev/null; then
              echo "API is live"
              break
            fi
            sleep 2
          done
          # Fail the job if the API never came up — never load-test a dead API.
          curl -sf http://localhost:5001/health/live \
            || { echo "❌ API never became live"; docker compose logs --tail 100 order-api; exit 1; }

      # k6 runs on the runner's host network so localhost:5001 reaches order-api.
      # A breached threshold exits non-zero and fails the job.
      - name: Run k6 load test
        id: k6
        run: |
          docker run --rm --network host --user "$(id -u):$(id -g)" \
            -e BASE_URL=http://127.0.0.1:5001 \
            -v "$PWD:/workspace" -w /workspace \
            grafana/k6:0.57.0 run \
            --out json=results.json --summary-export=summary.json \
            load-tests/k6/flash-sale.js

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: |
            results.json
            summary.json
          retention-days: 30

      - name: Report k6 results in job summary
        if: always()
        env:
          K6_STEP_OUTCOME: ${{ steps.k6.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_path = Path('summary.json')
          if not summary_path.exists():
              message = '## k6 load test\nSummary unavailable; inspect the earlier workflow steps.\n'
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
                  output.write(message)
              print(message)
              if os.environ.get('K6_STEP_OUTCOME') == 'success':
                  raise FileNotFoundError('k6 succeeded but did not write summary.json')
              raise SystemExit(0)

          summary = json.loads(summary_path.read_text())
          metrics = summary['metrics']

          def metric(name, key):
              data = metrics[name]
              return data.get(key, data.get('values', {}).get(key))

          p95 = metric('http_req_duration', 'p(95)')
          failure_rate = metric('http_req_failed', 'value')
          requests = metric('http_reqs', 'count')
          checks = metric('checks', 'value')
          if any(value is None for value in (p95, failure_rate, requests, checks)):
              raise ValueError('k6 summary is missing a required metric')

          rows = [
              '## k6 load test',
              f'- Commit: `{os.environ["GITHUB_SHA"]}`',
              '- Environment: GitHub Actions `ubuntu-latest`, Docker Compose',
              '',
              '| Metric | Value | Gate |',
              '| --- | ---: | --- |',
              f'| Requests | {requests} | Recorded |',
              f'| HTTP p95 | {p95:.2f} ms | {"PASS" if p95 < 250 else "FAIL"} (<250 ms) |',
              f'| HTTP failure rate | {failure_rate:.2%} | {"PASS" if failure_rate < 0.05 else "FAIL"} (<5%) |',
              f'| Checks | {checks:.2%} | {"PASS" if checks > 0.95 else "FAIL"} (>95%) |',
              '',
              'Full k6 JSON is attached as the `k6-results` artifact.',
          ]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('\n'.join(rows) + '\n')
          print('\n'.join(rows))
          PY
