name: Load Test (k6) - Gap G15

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  k6-load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No explicit -f: compose merges docker-compose.yml + docker-compose.override.yml,
      # so order-api is published on host port 5001 (override pins "5001:8080").
      - name: Start API dependencies (PostgreSQL, Redis, RabbitMQ)
        run: |
          docker compose up -d postgres redis rabbitmq
          sleep 10
          docker compose ps

      - name: Start order-api (runs migrations on boot)
        run: |
          docker compose up -d order-api
          sleep 15
          # Wait for API to be healthy
          for i in {1..30}; do
            if curl -sf http://localhost:5001/health/live >/dev/null; then
              echo "API is live"
              break
            fi
            sleep 2
          done
          # Fail the job if the API never came up — never load-test a dead API.
          curl -sf http://localhost:5001/health/live \
            || { echo "❌ API never became live"; docker compose logs --tail 100 order-api; exit 1; }

      # grafana/k6-action@v0.2.0 installs k6 AND runs the script in one step (docker
      # action, 4 inputs: cloud/token/filename/flags). Passing `filename` is required —
      # it defaults to a non-existent `test.js`. Threshold verdict comes from k6 itself:
      # a breached threshold (defined in load-tests/k6/flash-sale.js) exits non-zero,
      # which fails this step and the job.
      - name: Run k6 load test
        uses: grafana/k6-action@v0.2.0
        with:
          filename: load-tests/k6/flash-sale.js
          flags: --out json=results.json --summary-export=summary.json
        env:
          BASE_URL: http://localhost:5001

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: |
            results.json
            summary.json
          retention-days: 30

      - name: Post results to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            // --summary-export emits a single JSON object (results.json is JSON-lines,
            // which JSON.parse cannot read as a whole document).
            const summary = JSON.parse(fs.readFileSync('summary.json', 'utf8'));
            const metrics = summary.metrics;
            const p95 = metrics.http_req_duration?.values?.['p(95)'];
            const failRate = metrics.http_req_failed?.values?.rate;
            const reqs = metrics.http_reqs?.values?.count;
            const body = `## k6 Load Test Results
            | Metric | Value | Threshold | Status |
            |--------|-------|-----------|--------|
            | http_req_duration p95 | ${p95 != null ? p95.toFixed(2) : 'n/a'}ms | <250ms | ${p95 != null && p95 < 250 ? '✅' : '❌'} |
            | http_req_failed rate | ${failRate != null ? (failRate * 100).toFixed(2) : 'n/a'}% | <5% | ${failRate != null && failRate < 0.05 ? '✅' : '❌'} |
            | http_reqs | ${reqs ?? 'n/a'} | - | - |
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
