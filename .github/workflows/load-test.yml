name: Load Test (k6) - Gap G15

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  k6-load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/k6-action@v0.2.0
        with:
          version: latest

      - name: Start API dependencies (PostgreSQL, Redis, RabbitMQ)
        run: |
          docker compose -f docker-compose.yml up -d postgres redis rabbitmq
          sleep 10
          docker compose ps

      - name: Run API migrations
        run: |
          docker compose -f docker-compose.yml up -d api
          sleep 15
          # Wait for API to be healthy
          for i in {1..30}; do
            if curl -s http://localhost:5000/health/live >/dev/null; then
              echo "API is live"
              break
            fi
            sleep 2
          done

      - name: Run k6 load test
        run: |
          k6 run --out json=results.json load-tests/k6/flash-sale.js

      - name: Check thresholds
        run: |
          # Check if thresholds passed
          if ! k6 run --out json=results.json load-tests/k6/flash-sale.js --quiet 2>&1 | grep -q "thresholds.*passed"; then
            echo "❌ k6 thresholds failed"
            cat results.json | jq '.metrics'
            exit 1
          fi
          echo "✅ k6 thresholds passed"

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: results.json
          retention-days: 30

      - name: Post results to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('results.json', 'utf8'));
            const metrics = results.metrics;
            const body = `## k6 Load Test Results
            | Metric | Value | Threshold | Status |
            |--------|-------|-----------|--------|
            | http_req_duration p95 | ${metrics.http_req_duration?.values?.p95?.toFixed(2)}ms | <250ms | ${metrics.http_req_duration?.values?.p95 < 250 ? '✅' : '❌'} |
            | http_req_failed rate | ${(metrics.http_req_failed?.values?.rate * 100).toFixed(2)}% | <5% | ${metrics.http_req_failed?.values?.rate < 0.05 ? '✅' : '❌'} |
            | http_reqs | ${metrics.http_reqs?.values?.count} | - | - |
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
