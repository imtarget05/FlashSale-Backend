name: FlashSale Preview and Production Deploy

on:
  push:
    branches: [main, preview]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_to_production:
        description: Deploy the main branch to production
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: cloud-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Java unit tests
        working-directory: src/payment-service-java
        run: mvn -B -Dtest='!*Integration*' test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          VITE_API_URL=https://example.invalid VITE_ENV=ci npm run build

      - name: Validate Render blueprint
        run: |
          ruby - <<'RUBY'
          require 'yaml'

          data = YAML.load_file('render.yaml')
          services = Array(data['services'])
          expected = {
            'flashsale-payment-api-preview' => 'main',
            'flashsale-payment-api-prod' => 'main'
          }

          expected.each do |name, branch|
            service = services.find { |item| item['name'] == name }
            abort("Missing Render service: #{name}") unless service
            abort("Wrong branch for #{name}") unless service['branch'] == branch
            abort("Wrong health path for #{name}") unless service['healthCheckPath'] == '/healthz'
            abort("Render auto-deploy must be disabled for #{name}") unless service['autoDeploy'] == false

            env_vars = Array(service['envVars'])
            required_env_vars = {
              'OIDC_ISSUER_URI' => { 'sync' => false },
              'OIDC_AUDIENCE' => { 'sync' => false },
              'OIDC_AUTHORITIES_CLAIM' => { 'value' => 'roles' }
            }
            required_env_vars.each do |key, settings|
              variable = env_vars.find { |item| item['key'] == key }
              abort("Missing Render environment variable #{key} for #{name}") unless variable
              settings.each do |setting, value|
                abort("Wrong #{setting} for #{key} in #{name}") unless variable[setting] == value
              end
            end

            if env_vars.any? { |item| item['key'] == 'JWT_SIGNING_KEY' }
              abort("Production-profile service must not configure JWT_SIGNING_KEY: #{name}")
            end
          end

          puts 'Render preview/production blueprint validated.'
          RUBY

  deploy-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/preview'
    needs: verify
    runs-on: ubuntu-latest
    environment: preview
    env:
      RENDER_URL: ${{ vars.RENDER_PREVIEW_URL }}
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_PREVIEW }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate preview deploy settings
        run: |
          test -n "$RENDER_URL" || { echo "Missing preview environment variable RENDER_PREVIEW_URL"; exit 1; }
          test -n "$RENDER_DEPLOY_HOOK" || { echo "Missing preview secret RENDER_DEPLOY_HOOK_PREVIEW"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Deploy backend to Render preview
        run: |
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK"
          attempt=1
          while [ "$attempt" -le 36 ]; do
            if curl --fail --silent --output /dev/null "$RENDER_URL/health/live"; then
              echo "Render preview is healthy."
              exit 0
            fi
            sleep 10
            attempt=$((attempt + 1))
          done
          echo "Render preview did not become healthy within 6 minutes."
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and deploy Cloudflare Pages preview
        run: |
          npm ci --prefix frontend
          VITE_API_URL="$RENDER_URL" VITE_ENV=preview npm run build --prefix frontend
          npx --yes wrangler@4 pages deploy frontend/dist \
            --project-name=flashsale-frontend \
            --branch=preview

  deploy-production:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_to_production
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      RENDER_URL: ${{ vars.RENDER_PRODUCTION_URL }}
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_PRODUCTION }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate production deploy settings
        run: |
          test -n "$RENDER_URL" || { echo "Missing production environment variable RENDER_PRODUCTION_URL"; exit 1; }
          test -n "$RENDER_DEPLOY_HOOK" || { echo "Missing production secret RENDER_DEPLOY_HOOK_PRODUCTION"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Deploy backend to Render production
        run: |
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK"
          attempt=1
          while [ "$attempt" -le 36 ]; do
            if curl --fail --silent --output /dev/null "$RENDER_URL/health/live"; then
              echo "Render production is healthy."
              exit 0
            fi
            sleep 10
            attempt=$((attempt + 1))
          done
          echo "Render production did not become healthy within 6 minutes."
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and deploy Cloudflare Pages production
        run: |
          npm ci --prefix frontend
          VITE_API_URL="$RENDER_URL" VITE_ENV=production npm run build --prefix frontend
          npx --yes wrangler@4 pages deploy frontend/dist \
            --project-name=flashsale-frontend \
            --branch=main
