name: FlashSale DevSecOps (Dev + Preview + Prod)

on:
  push:
    branches: [main, dev, feat/**]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_to_production:
        description: 'Deploy to production Render + Pages?'
        required: false
        default: 'false'

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  MAVEN_VERSION: '3.9.6'

jobs:
  build-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install web deps
        working-directory: src/OpsBridge.Web
        working-directory: src/OpsBridge.Web
        run: npm run build
      - name: Build payment service
        working-directory: src/payment-service-java
        run: ./mvnw -DskipTests package
      - name: .NET build
        run: dotnet build AzureFlashSale.slnx --no-restore
      - name: .NET tests
        run: dotnet test AzureFlashSale.slnx --no-build --logger trx --results-directory test-results
      - name: Upload .NET coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-coverage
          path: tests/UnitTests/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

  security-scan:
    runs-on: ubuntu-latest
    needs: build-and-unit
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: flashsale/payment-service:ci-${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  sonarqube:
    if: vars.SONAR_ENABLED == 'true'
    runs-on: ubuntu-latest
    needs: [build-and-unit, security-scan]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "SKIP: SONAR_TOKEN not configured."
            exit 0
          fi
          dotnet tool install --global dotnet-sonarscanner
          dotnet sonarscanner begin \
            /k:"imtarget05_FlashSale-Backend" \
            /o:"imtarget05" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.vstest.reportsPaths="**/*.trx" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.qualitygate.timeout=600
          dotnet build AzureFlashSale.slnx
          dotnet test AzureFlashSale.slnx --no-build -v q

  deploy-render-preview:
    needs: [build-and-unit, security-scan]
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Render deploy (staging)
        run: |
          echo "Deploying staging..."

  deploy-pages-preview:
    needs: [build-and-unit, security-scan]
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Cloudflare Pages deploy (preview)
        run: |
          echo "Deploying Pages preview..."

  deploy-production:
    needs: [build-and-unit, security-scan, deploy-render-preview, deploy-pages-preview]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment:
      name: production
      url: https://flashsale.onrender.com
    steps:
      - uses: actions/checkout@v4
                                                                   echo "Production deploy initiated..."
