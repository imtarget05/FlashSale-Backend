# ExternalSecret — syncs runtime secrets from Azure Key Vault into flashsale-secrets
# Key names MUST match infrastructure/kubernetes/README-secrets.md contract.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: flashsale-secrets
  namespace: flash-sale-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: SecretStore
  target:
    name: flashsale-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: pg-connection
      remoteRef:
        key: pg-connection
    - secretKey: redis-connection
      remoteRef:
        key: redis-connection
    - secretKey: rabbitmq-connection
      remoteRef:
        key: rabbitmq-connection
    - secretKey: jwt-signing-key
      remoteRef:
        key: jwt-signing-key
    - secretKey: agent-recovery-hmac-key
      remoteRef:
        key: agent-recovery-hmac-key
    - secretKey: pg-password
      remoteRef:
        key: pg-password
    - secretKey: rabbitmq-password
      remoteRef:
        key: rabbitmq-password
---
# HashiCorp Vault alternative — uncomment and adjust if using Vault instead of Azure Key Vault
