# External Secrets Operator — Azure Key Vault backend
# ---------------------------------------------------
# Replaces the manual `kubectl create secret` bootstrap with GitOps-managed
# secret sync from Azure Key Vault. Requires:
#   - External Secrets Operator installed in the cluster
#   - Workload Identity (or a Service Principal) with "Key Vault Secrets User" on the vault
#   - Azure Key Vault: kv-flashsale (or your vault name)
#
# Apply AFTER the SecretStore's referenced ServiceAccount/WorkloadIdentity is in place.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: azure-keyvault
  namespace: flash-sale-prod
spec:
  provider:
    azurekv:
      # Key Vault URL — set via overlay or env
      vaultUrl: "https://kv-flashsale.vault.azure.net/"
      # Use Workload Identity (recommended) — no client secret in cluster
      authType: WorkloadIdentity
      # ServiceAccount annotated with azure.workload.identity/client-id
      serviceAccountRef:
        name: external-secrets-sa
        namespace: flash-sale-prod
---
# ClusterSecretStore variant (cluster-scoped, usable from any namespace)
# Uncomment if you prefer cluster-wide access:
# apiVersion: external-secrets.io/v1beta1
# kind: ClusterSecretStore
# metadata:
#   name: azure-keyvault-cluster
# spec:
#   provider:
#     azurekv:
#       vaultUrl: "https://kv-flashsale.vault.azure.net/"
#       authType: WorkloadIdentity
#       serviceAccountRef:
#         name: external-secrets-sa
#         namespace: external-secrets
EOF