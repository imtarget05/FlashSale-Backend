apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
  labels:
    app: order-api
    project: flash-sale
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-api
  template:
    metadata:
      labels:
        app: order-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: order-api
          image: order-api:placeholder-set-by-overlay
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: dlq-logs
              mountPath: /app/logs
            - name: tmp
              mountPath: /tmp
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "production"
            - name: SERVER_PORT
              value: "8080"
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: flashsale-secrets
                  key: pg-connection
            - name: SPRING_DATA_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: flashsale-secrets
                  key: redis-connection
            - name: SPRING_RABBITMQ_ADDRESSES
              valueFrom:
                secretKeyRef:
                  name: flashsale-secrets
                  key: rabbitmq-connection
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: flashsale-secrets
                  key: rabbitmq-username
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flashsale-secrets
                  key: rabbitmq-password
            - name: MESSAGING_PROVIDER
              value: "RabbitMQ"
            - name: MESSAGING_QUEUE_NAME
              value: "orders"
            - name: JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: flashsale-secrets
                  key: jwt-signing-key
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: dlq-logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
