apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app: kafka
    project: flash-sale
spec:
  publishNotReadyAddresses: true
  selector:
    app: kafka
  ports:
    - name: plaintext
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels:
    app: kafka
    project: flash-sale
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      # Seed a writable copy of the image's default Kafka config: the broker
      # entrypoint rewrites /opt/kafka/config at startup, which fails on a
      # read-only root. The main container then mounts the seed (writable).
      initContainers:
        - name: kafka-config-seed
          image: apache/kafka:3.8.0
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "cp -r /opt/kafka/config/. /config-seed/"]
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: kafka-config
              mountPath: /config-seed
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            # apache/kafka image runs as UID 1001 (appuser); pinned above at pod
            # level + read-only root like postgres/rabbitmq/redis.
            runAsNonRoot: true
            runAsUser: 1001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 9092
            - containerPort: 9093
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@127.0.0.1:9093"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_NUM_PARTITIONS
              value: "3"
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"
            - name: KAFKA_JVM_PERFORMANCE_OPTS
              value: "-Xms128m -Xmx256m -XX:+UseG1GC"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              # 384Mi OOMKilled the broker (exit 137): Xmx256m is only the Java
              # heap — metaspace + code cache + thread stacks + direct buffers
              # push KRaft RSS well past 384Mi. 640Mi keeps the v2 budget while
              # surviving; cpu 500m also starved controller heartbeats
              # (REQUEST_TIMED_OUT storms), so the limit goes to 1.
              cpu: "1"
              memory: 640Mi
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 25
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          # NOTE: parent mount (/tmp) must come before the child
          # (/tmp/kraft-combined-logs) or the child is hidden by the parent.
          volumeMounts:
            # Scratch writable dirs required by a read-only root: /tmp
            # (Kafka + JVM temp files) alongside the existing log-data volume.
            - name: kafka-tmp
              mountPath: /tmp
            - name: kafka-data
              mountPath: /tmp/kraft-combined-logs
            # Writable seeded copy of the image config (see initContainer above).
            - name: kafka-config
              mountPath: /opt/kafka/config
            # JVM GC logs default to /opt/kafka/logs — writable scratch.
            - name: kafka-logs
              mountPath: /opt/kafka/logs
      volumes:
        - name: kafka-data
          emptyDir: {}
        - name: kafka-tmp
          emptyDir: {}
        - name: kafka-config
          emptyDir: {}
        - name: kafka-logs
          emptyDir: {}
