# Phase 7C migration contract — schema is brought to head BEFORE the workloads
# are allowed to roll, instead of by whichever pod happens to start first.
#
# Why a Job and not the existing startup migration: base/api/deployment.yaml runs
# `replicas: 2`, so two API pods (plus the worker) each call Flyway migration
# against the same PostgreSQL. That is a race on every rollout. A Job gives the
# migration one attempt, one owner, a retry budget, and a log stream
# (`kubectl logs job/order-migrate`) that says exactly which migrations were applied.
#
# Ordering is expressed with a Helm-style `job-before-rollout` workflow rather
# than a k8s field: Kubernetes has no "run this Job before those Deployments"
# primitive inside one apply. The GitOps sync step (Phase 7D) is expected to
# apply this Job and wait for completion before syncing the deployments.
apiVersion: batch/v1
kind: Job
metadata:
  name: order-migrate
  labels:
    app: order-migrate
    project: flash-sale
    role: migration
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  completionMode: NonIndexed
  template:
    metadata:
      labels:
        app: order-migrate
        role: migration
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: migrate
          image: order-api
          args:
            - "--spring.profiles.active=migration"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: flashsale-secrets
                  key: pg-connection
            - name: SPRING_FLYWAY_ENABLED
              value: "true"
            - name: SPRING_FLYWAY_LOCATIONS
              value: "classpath:db/migration"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
