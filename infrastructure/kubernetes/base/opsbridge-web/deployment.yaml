# OpsBridge web tier — the browser front end (src/OpsBridge.Web) served as a
# built static bundle behind nginx.
#
# This manifest states the contract the image MUST satisfy. The image itself
# (Dockerfile.web) is written by another slice; the contract is fixed and is
# restated here so a change to either side is a visible mismatch:
#
#   * the container listens on 8080, NOT 80, so it can run as a non-root user
#     (binding a privileged port is the one thing a non-root process cannot do
#     without a capability this pod does not have);
#   * the process runs as uid 1654 (ADR-007), the same identity as the rest of
#     the tree;
#   * `/api/*` is proxied to ${API_UPSTREAM} with the request URI UNCHANGED
#     (the client calls `/api/v1/...` — see
#     src/OpsBridge.Web/src/lib/api-client.ts:19), so the API sees the path it
#     expects;
#   * `API_UPSTREAM` names the API's **SERVICE** address and port
#     (`http://opsbridge-api:80`), not its container port (8080): a ClusterIP
#     only answers the ports its Service declares, so `http://opsbridge-api:8080`
#     is dropped by kube-proxy even though the pod is listening there. The
#     image's own default (`http://opsbridge-api:8080`) is the CONTAINER port,
#     which is the right address for a Docker-to-Docker hop and the wrong one
#     for Kubernetes — which is exactly why this manifest sets the variable
#     explicitly instead of relying on the default;
#   * exactly three paths are writable — the three the image declares — and
#     they are mounted as three separate `emptyDir`s (see `volumeMounts`);
#   * every other path falls back to index.html (client-side routing: a deep
#     link such as /invoices must return the shell, not a 404);
#   * `/healthz` answers 200;
#   * access/error logs go to stdout/stderr, so the pod needs no writable log
#     directory.
#
# The reverse proxy is not decoration: the client uses a RELATIVE base URL
# (`/api/v1`), so a same-origin proxy removes the cross-origin surface
# entirely — no CORS, no preflight, no third-party origin allowed to send the
# bearer token. See ADR-020.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsbridge-web
  labels:
    app: opsbridge-web
    project: opsbridge
    role: web
spec:
  # Two replicas: the web tier is stateless (a bundle on disk plus a proxy), so
  # it scales like the API and survives a node drain without taking the UI down.
  replicas: 2
  selector:
    matchLabels:
      app: opsbridge-web
  template:
    metadata:
      labels:
        app: opsbridge-web
    spec:
      # Same pod-level hardening as the rest of the tree (ADR-007): the image
      # already runs as uid 1654, and declaring it here makes kubelet ENFORCE it
      # rather than trusting the image default.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        # The group matters as much as the user here: the writable paths below
        # are emptyDir volumes, and kubelet makes an emptyDir group-writable
        # for `fsGroup`. With runAsGroup == fsGroup == 1654 the nginx worker
        # processes own what they write.
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opsbridge-web
          # Registry-neutral image NAME, the base convention: the prod overlay's
          # `images:` transformer rewrites this to the pinned SHA. The image does
          # NOT exist in any registry yet, which is why this directory is NOT
          # referenced by infrastructure/kubernetes/base/kustomization.yaml — see
          # README.md ("Adoption steps") for the exact steps that make it
          # deployable.
          image: opsbridge-web:placeholder-set-by-overlay
          # container-level hardening (Trivy KSV-0014/KSV-0118): pod-level
          # securityContext alone does not satisfy these checks.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            # 8080, not 80. The container runs as a non-root user, and a
            # non-root process cannot bind a privileged port (<1024) without a
            # capability this pod deliberately drops. The Service maps 80 ->
            # 8080 so the rest of the platform (Gateway API backendRefs) keeps
            # using port 80.
            - name: http
              containerPort: 8080
          env:
            # The upstream the image proxies /api/* to. It is a plain in-cluster
            # Service DNS name — an ADDRESS, not a credential, so it is a
            # literal value here and never a Secret reference.
            #
            # The port is the SERVICE port (80), not the container port (8080):
            # a ClusterIP only listens on the ports its Service declares, so
            # `http://opsbridge-api:8080` would be DROPPED by kube-proxy. The
            # 80 -> 8080 mapping lives in Service/opsbridge-api.
            - name: API_UPSTREAM
              value: http://opsbridge-api:80
          volumeMounts:
            # THE VOLUME CONTRACT: exactly the three paths the image declares
            # as writable, and nothing else.
            #
            # The image (Dockerfile.web) creates these three directories at
            # build time and chowns them to opsbridge:opsbridge (uid/gid
            # 1654):
            #
            #   /tmp/nginx/conf.d   the rendered server block (the envsubst
            #                       output directory, NGINX_ENVSUBST_OUTPUT_DIR)
            #   /tmp/nginx/cache    the nginx temp directories (client_body,
            #                       proxy, fastcgi, uwsgi, scgi)
            #   /tmp/nginx/run      the pid file (/tmp/nginx/run/nginx.pid)
            #
            # They are mounted SEPARATELY, on purpose:
            #
            #   * mounting them separately keeps the image's own directories
            #     in place (each mount hides only the path it covers, and the
            #     emptyDir that replaces it is writable by uid 1654 because
            #     of fsGroup below);
            #   * mounting /tmp WHOLESALE would be a different thing
            #     altogether: an emptyDir at /tmp REPLACES the image's whole
            #     /tmp tree, so the pre-created, pre-owned conf.d, cache and
            #     run directories disappear and the container is left with a
            #     volume it has to create them in itself - the very thing
            #     readOnlyRootFilesystem forbids;
            #   * /var/cache/nginx and /var/run are the STOCK nginx image's
            #     paths. This image does not use them (nginx.conf points the
            #     temp paths and the pid file at /tmp/nginx), so mounting them
            #     gives the container writable directories it never writes to
            #     and hides nothing that matters.
            #
            # The contract is asserted, not just documented: the contract test
            # (src/OpsBridge.Web/contract/image-manifest-contract.test.mjs)
            # reads Dockerfile.web and fails when the two sides drift apart in
            # either direction.
            - name: nginx-conf-d
              mountPath: /tmp/nginx/conf.d
            - name: nginx-cache
              mountPath: /tmp/nginx/cache
            - name: nginx-run
              mountPath: /tmp/nginx/run
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              # /healthz is answered by the IMAGE itself (the nginx config
              # has an explicit location for it), NOT proxied to the API. That
              # is deliberate: the web tier serves the application shell
              # whether or not the API is up, so a liveness probe that failed
              # on an API outage would restart healthy nginx processes and
              # turn a partial outage into a full one.
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              # Same path, for the same reason: readiness answers "can this
              # pod serve the shell?", not "is the whole system healthy?".
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        # emptyDir, not hostPath and not a persistent volume: these are scratch
        # directories whose contents die with the pod. Nothing is written to
        # the node, and a pod that is rescheduled starts with empty scratch
        # space.
        - name: nginx-conf-d
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
