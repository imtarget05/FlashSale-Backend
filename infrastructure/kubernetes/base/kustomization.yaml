apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Tier ứng dụng (Java Spring Boot) — chạy trên AKS.
# Data tier (PostgreSQL/Redis/RabbitMQ) KHÔNG tự quản lý trong cluster nữa:
#   - PostgreSQL → Azure Database for PostgreSQL Flexible Server (PaaS, private endpoint)
#   - Redis      → Azure Managed Redis (PaaS, TLS)
#   - RabbitMQ   → RabbitMQ Cluster Operator trên AKS (quorum queues, 3 node)
# Secret `flashsale-secrets` cung cấp kết nối đến các dịch vụ PaaS/Operator.
# order-api / order-worker / order-migrate đã được retire; payment-service là workload còn lại.
resources:
  - payment/deployment.yaml
  - payment/service.yaml
  - ingress.yaml

labels:
  - pairs:
      project: flash-sale
      part-of: flash-sale-order-platform
