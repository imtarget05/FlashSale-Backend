apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-worker
  labels:
    app: order-worker
    project: flash-sale
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-worker
  template:
    metadata:
      labels:
        app: order-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: order-worker
          image: order-worker
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "production"
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: flashsale-secrets
                  key: pg-connection
            - name: SPRING_DATA_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: flashsale-secrets
                  key: redis-connection
            - name: SPRING_RABBITMQ_ADDRESSES
              valueFrom:
                secretKeyRef:
                  name: flashsale-secrets
                  key: rabbitmq-connection
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: flashsale-secrets
                  key: rabbitmq-username
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flashsale-secrets
                  key: rabbitmq-password
            - name: MESSAGING_PROVIDER
              value: "RabbitMQ"
            - name: MESSAGING_QUEUE_NAME
              value: "orders"
          volumeMounts:
            - name: dlq-logs
              mountPath: /app/logs
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: dlq-logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
