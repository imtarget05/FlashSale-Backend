apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flashsale
  namespace: flashsale
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: portfolio-gateway
      namespace: platform-gateway
      sectionName: https
  rules:
    - backendRefs:
        - name: payment-service
          port: 80
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /health
      matches:
        - path:
            type: PathPrefix
            value: /flashsale/health
    - backendRefs:
        - name: payment-service
          port: 80
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /api
      matches:
        - path:
            type: PathPrefix
            value: /api/payments
