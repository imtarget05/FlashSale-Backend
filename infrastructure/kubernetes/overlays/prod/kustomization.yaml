apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: flash-sale-prod

resources:
  - ../../base

replicas:
  - name: order-api
    count: 2

images:
  # `name` MUST equal the image name declared in base (registry-neutral,
  # e.g. `order-api:placeholder-set-by-overlay`); Kustomize matches on that
  # name and silently skips the transform when it does not match. The real
  # registry host therefore belongs in `newName`, not in `name`.
  # The previous form (`name: acrflashsalep6.azurecr.io/order-api`) never
  # matched the base, so the rendered manifest kept a non-existent
  # placeholder registry + `:latest` → guaranteed ImagePullBackOff.
  #
  # newTag is pinned to the released commit SHA by the CI `gitops-update`
  # job — never hand-edit it, and never use `latest` (ADR-011). Both images
  # ship from the same commit, so the same SHA is correct for both.
  - name: order-api
    newName: acrflashsalep6.azurecr.io/order-api
    newTag: ef483024696fe1988c0f829add71260833055aed
  - name: order-worker
    newName: acrflashsalep6.azurecr.io/order-worker
    newTag: ef483024696fe1988c0f829add71260833055aed

commonLabels:
  env: prod

