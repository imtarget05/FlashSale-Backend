apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: flash-sale-prod

resources:
  - ../../base

replicas:
  - name: order-api
    count: 2

images:
  # Real ACR login server (Terraform output `acr_login_server`, Phase 6).
  # newTag is pinned to the released commit SHA by the CI `gitops-update` job —
  # never flip this to a hand-written tag, and never to `latest` (ADR-011).
  - name: acrflashsalep6.azurecr.io/order-api
    newTag: 4a2a88712a0c9eb58fa3b6c6085329fbc187d149

commonLabels:
  env: prod
