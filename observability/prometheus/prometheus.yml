# Prometheus scrape config - flashsale only.
# Apps run on the Docker host (or in their own compose stack); this stack
# only observes. host.docker.internal reaches them from inside the container.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    metrics_path: /metrics
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'payment-readiness'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['__PAYMENT_READINESS_URL__']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
