# Alert rules - standard PromQL only. The `services` group is generic;
# the `gateway` group only exists in repos that vendor llm-gateway/.
groups:

  - name: services
    interval: 15s
    rules:
      - alert: PaymentServiceReadinessDown
        expr: probe_success{job="payment-readiness"} == 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "Payment service readiness is down"
          description: "Readiness endpoint {{ $labels.instance }} did not return HTTP 2xx for 15 seconds."
