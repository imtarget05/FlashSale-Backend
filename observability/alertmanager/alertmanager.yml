# Alertmanager - log-only receiver (no SMTP). Alerts are visible in the
# Alertmanager UI and container logs only.
global:
  resolve_timeout: 5m

route:
  receiver: webhook-local
  group_by: ['alertname', 'job']
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  - name: webhook-local
    webhook_configs:
      - url: 'http://webhook-receiver:9094/alerts'
        send_resolved: true
