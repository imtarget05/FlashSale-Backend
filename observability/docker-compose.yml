# Self-contained observability stack for FlashSale Backend.
#
#   docker compose up -d      # Prometheus :9105  Grafana :3205  Alertmanager :9305
#   docker compose down -v     # stop and drop the TSDB
#
# Scrape targets are the services THIS repo runs (see prometheus/prometheus.yml).
# A target that is not running shows as DOWN and never breaks the scrape loop.
services:
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: flashsale-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9105}:9090"
    environment:
      - PAYMENT_READINESS_URL=${PAYMENT_READINESS_URL:-http://host.docker.internal:8081/actuator/health/readiness}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml.template:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./scripts/start-prometheus.sh:/etc/prometheus/start-prometheus.sh:ro
      - prometheus-data:/prometheus
    entrypoint: ["/bin/sh", "/etc/prometheus/start-prometheus.sh"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - alertmanager
      - blackbox-exporter

  grafana:
    image: grafana/grafana:10.4.0
    container_name: flashsale-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3205}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: flashsale-alertmanager
    restart: unless-stopped
    ports:
      - "${ALERTMANAGER_PORT:-9305}:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    depends_on:
      webhook-receiver:
        condition: service_healthy

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: flashsale-blackbox-exporter
    restart: unless-stopped
    expose:
      - "9115"
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'

  webhook-receiver:
    image: python:3.12-alpine
    container_name: flashsale-webhook-receiver
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ALERT_RECEIVER_PORT:-9094}:9094"
    volumes:
      - ./scripts/alert_receiver.py:/app/alert_receiver.py:ro
    command: ["python", "/app/alert_receiver.py"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9094/healthz')"
      interval: 5s
      timeout: 2s
      retries: 5

volumes:
  prometheus-data:
  grafana-data:
