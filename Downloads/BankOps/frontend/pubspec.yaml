name: bankops
description: "BankOps — ứng dụng demo kho vật tư/tài sản và quỹ mô phỏng. Mọi dữ liệu là giả lập."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  intl: ^0.19.0
  google_sign_in: ^6.2.1
  http: ^1.2.0
  flutter_secure_storage: ^9.2.2
  fl_chart: ^0.68.0
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sample-data/
