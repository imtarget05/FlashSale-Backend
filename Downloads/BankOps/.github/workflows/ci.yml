name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Ruff
        run: pip install ruff
      - name: Lint
        run: ruff check backend/

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bankops
          POSTGRES_PASSWORD: bankops
          POSTGRES_DB: bankops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bankops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        run: pip install poetry poetry-plugin-export
      - name: Install dependencies
        run: |
          cd backend
          poetry export -o requirements.txt --without-hashes
          pip install -r requirements.txt
      - name: Run migration
        run: |
          cd backend
          DATABASE_URL="postgresql+psycopg2://bankops:bankops@localhost:5432/bankops" alembic upgrade head
      - name: Run tests
        run: |
          cd backend
          DATABASE_URL="postgresql+psycopg2://bankops:bankops@localhost:5432/bankops" pytest tests/ -v

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f backend/Dockerfile -t bankops-api:latest backend/
      - name: Validate compose
        run: docker compose config
      - name: Verify build
        run: echo "Docker build successful"
