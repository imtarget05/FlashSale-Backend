services:
  postgres:
    image: postgres:16-alpine
    container_name: bankops-db
    environment:
      POSTGRES_USER: bankops
      POSTGRES_PASSWORD: bankops
      POSTGRES_DB: bankops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankops"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: backend
    container_name: bankops-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://bankops:bankops@postgres:5432/bankops
      - APP_ENV=demo
      - ALLOWED_ORIGINS=["http://localhost:3000","http://localhost:8080","http://127.0.0.1:8080"]
    ports:
      - "8000:8000"
    volumes:
      - ./sample-data:/sample-data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      sh -c "
        alembic upgrade head &&
        python -c 'from app.seed import seed_demo; import asyncio; asyncio.run(seed_demo())' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000
      "

  worker:
    build:
      context: backend
    container_name: bankops-worker
    depends_on:
      api:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://bankops:bankops@postgres:5432/bankops
      - APP_ENV=demo
    restart: unless-stopped
    command: >
      sh -c "
        python -m app.worker
      "

  frontend-web:
    image: nginx:alpine
    container_name: bankops-frontend
    depends_on:
      - api
    ports:
      - "8080:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local