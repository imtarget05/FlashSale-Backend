[tool.poetry]
name = "bankops-backend"
version = "0.1.0"
description = "BankOps backend - FastAPI modular monolith for inventory and cash simulation"
authors = ["BankOps Team"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
pydantic = "^2.9.0"
alembic = "^1.13.0"
sqlalchemy = "^2.0.35"
psycopg2-binary = "^2.9.9"
asyncpg = "^0.29.0"
pydantic-settings = "^2.5.0"
opentelemetry-api = "^1.25.0"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
bcrypt = "<4.1"
itsdangerous = "^2.1.0"
greenlet = "^3.0.0"
python-multipart = "^0.0.10"
python-dotenv = "^1.0.0"
httpx = "^0.27.0"
pyyaml = "^6.0.2"
redis = "^5.0.0"
google-auth = "^2.30.0"
requests = "^2.31.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
httpx = "^0.27.0"
alembic = "^1.13.0"
testcontainers = "^4.8.0"
ruff = "^0.6.0"
mypy = "^1.11.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]
# B008 flags FastAPI `Depends(...)` in defaults — idiomatic FastAPI, not a bug.
# Scoped per-file so genuine B008 elsewhere still fires.
per-file-ignores = { "app/api/routes/*.py" = ["B008"], "app/database.py" = ["B008"] }

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"