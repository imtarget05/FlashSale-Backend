syntax = "proto3";

package com.flashsale.payment;

option java_package = "com.flashsale.payment.grpc";
option java_outer_classname = "PaymentProto";

// gRPC service for payment processing. Used for service-to-service calls,
// while REST endpoints remain the client-facing API.
service PaymentService {
  rpc ProcessPayment(ProcessPaymentRequest) returns (ProcessPaymentResponse);
  rpc CheckHealth(HealthCheckRequest) returns (HealthCheckResponse);
}

message ProcessPaymentRequest {
  string idempotency_key = 1;
  int64 order_id = 2;
  string payment_id = 3;
  string amount = 4;      // decimal as string to avoid precision loss
  string currency = 5;
}

message ProcessPaymentResponse {
  string idempotency_key = 1;
  bool success = 2;
  string status = 3;
  string transaction_id = 4;
  string failure_reason = 5;
  bool is_transient_error = 6;
  string processed_at = 7;
}

message HealthCheckRequest {}

message HealthCheckResponse {
  string status = 1;
  string service = 2;
}
