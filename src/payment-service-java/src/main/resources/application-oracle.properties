# Oracle profile — KHÔNG bật mặc định. Chỉ áp dụng khi chạy với --spring.profiles.active=oracle
# và cung cấp credential Oracle qua biến môi trường (không hard-code).
spring.datasource.url=${ORACLE_JDBC_URL:jdbc:oracle:thin:@//localhost:1521/ORCLPDB1}
spring.datasource.username=${ORACLE_USER:}
spring.datasource.password=${ORACLE_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate
