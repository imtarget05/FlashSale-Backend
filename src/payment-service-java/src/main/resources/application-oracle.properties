# Oracle database profile (for production/Oracle environments)
# Activate with: --spring.profiles.active=oracle

spring.datasource.url=${ORACLE_JDBC_URL:jdbc:oracle:thin:@//oracle-host:1521/ORCLPDB1}
spring.datasource.username=${ORACLE_USER:payment_user}
spring.datasource.password=${ORACLE_PASSWORD:payment_password}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# Oracle-specific: use sequence for payment_id generation if needed
spring.jpa.properties.hibernate.default_schema=PAYMENT_SCHEMA
