spring.application.name=payment-service
server.port=${PORT:${SERVER_PORT:8080}}
grpc.server.enabled=${GRPC_SERVER_ENABLED:false}
grpc.server.port=${GRPC_SERVER_PORT:9090}
grpc.server.tls.certificate-chain=${GRPC_TLS_CERT_CHAIN:}
grpc.server.tls.private-key=${GRPC_TLS_PRIVATE_KEY:}
spring.http.converters.preferred-json-mapper=jackson2
spring.http.codecs.preferred-json-mapper=jackson2

# Datasource. Do not hardcode a container host like 'postgres' here because Render and local Docker use different service names.
# Render must override SPRING_DATASOURCE_* in the dashboard; local compose injects them explicitly.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/FlashSaleDb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver
# Bound connection acquisition so readiness can fail within the Kubernetes probe window.
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:3000}
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT_MS:1000}

# Run all Flyway migrations from scratch on fresh databases.
spring.flyway.baseline-on-migrate=false

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# RabbitMQ (Render and local Docker both set SPRING_* names; keep legacy RABBITMQ_* aliases for local compatibility)
spring.rabbitmq.addresses=${SPRING_RABBITMQ_ADDRESSES:}
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:${RABBITMQ_HOST:rabbitmq}}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:${RABBITMQ_PORT:5672}}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:${RABBITMQ_USER:guest}}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:${RABBITMQ_PASSWORD:guest}}
spring.rabbitmq.connection-timeout=10000
spring.rabbitmq.ssl.enabled=${SPRING_RABBITMQ_SSL_ENABLED:false}
spring.rabbitmq.virtual-host=${SPRING_RABBITMQ_VHOST:/}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
# Prevent RabbitMQ listener from blocking startup on Render
spring.rabbitmq.listener.simple.auto-startup=${RABBITMQ_AUTO_STARTUP:true}
payment.outbox.poll-interval-ms=1000

# Redis (Render sets SPRING_DATA_REDIS_*; local compose uses REDIS_* aliases)
spring.data.redis.url=${REDIS_URL:${SPRING_DATA_REDIS_URL:}}
spring.data.redis.ssl.enabled=${SPRING_DATA_REDIS_SSL_ENABLED:false}
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:${REDIS_HOST:redis}}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:1s}
spring.data.redis.timeout=${REDIS_COMMAND_TIMEOUT:1s}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:}}

# Cache (Redis)
spring.cache.type=${CACHE_TYPE:none}
# Disable Redis auto-configuration when Redis is not available (set REDIS_AUTOCONFIG_EXCLUDE to the class name)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
spring.cache.cache-names=payments
spring.cache.redis.time-to-live=300000

# Legacy HS256 signing is required outside production; production request auth uses OIDC.
app.jwt.secret=${JWT_SIGNING_KEY:}
app.jwt.expiration-ms=86400000

# Production OIDC resource server (required when production/prod profile is active)
app.security.oidc.issuer-uri=${OIDC_ISSUER_URI:}
app.security.oidc.audience=${OIDC_AUDIENCE:}
app.security.oidc.authorities-claim=${OIDC_AUTHORITIES_CLAIM:roles}
demo.auth.password=${DEMO_AUTH_PASSWORD:}

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.com.flashsale.payment=INFO
logging.level.org.springframework=INFO

# Actuator / Metrics (Prometheus)
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=payment-service
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,rabbit,redis
# Payment provider (PSP) - optional Stripe integration
stripe.api.key=${STRIPE_API_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}

management.endpoint.health.validate-group-membership=false
