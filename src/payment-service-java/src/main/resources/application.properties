spring.application.name=payment-service
server.port=8080
spring.http.converters.preferred-json-mapper=jackson2
spring.http.codecs.preferred-json-mapper=jackson2

# Datasource (overridable via environment variables)
spring.datasource.url=${POSTGRES_JDBC_URL:jdbc:postgresql://postgres:5432/FlashSaleDb}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.consumer.group-id=payment-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.producer.retries=3
spring.kafka.producer.acks=all
app.kafka.listener.auto-startup=${APP_KAFKA_LISTENER_AUTO_STARTUP:false}

# Redis
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

# Cache (Redis)
spring.cache.type=redis
spring.cache.cache-names=payments
spring.cache.redis.time-to-live=300000

# JWT (no insecure default: the service fails to start if JWT_SIGNING_KEY is not provided)
app.jwt.secret=${JWT_SIGNING_KEY:}
app.jwt.expiration-ms=86400000
demo.auth.password=${DEMO_AUTH_PASSWORD:}

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.com.flashsale.payment=INFO
logging.level.org.springframework=INFO

# Actuator / Metrics (Prometheus)
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=payment-service
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,redis,rabbit
