spring.application.name=payment-service
server.port=8080
grpc.server.enabled=${GRPC_SERVER_ENABLED:false}
grpc.server.port=${GRPC_SERVER_PORT:9090}
grpc.server.tls.certificate-chain=${GRPC_TLS_CERT_CHAIN:}
grpc.server.tls.private-key=${GRPC_TLS_PRIVATE_KEY:}
spring.http.converters.preferred-json-mapper=jackson2
spring.http.codecs.preferred-json-mapper=jackson2

# Datasource (overridable via environment variables)
spring.datasource.url=${POSTGRES_JDBC_URL:jdbc:postgresql://postgres:5432/FlashSaleDb}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
payment.outbox.poll-interval-ms=1000

# Redis
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Cache (Redis)
spring.cache.type=redis
spring.cache.cache-names=payments
spring.cache.redis.time-to-live=300000

# JWT (no insecure default: the service fails to start if JWT_SIGNING_KEY is not provided)
app.jwt.secret=${JWT_SIGNING_KEY:}
app.jwt.expiration-ms=86400000
demo.auth.password=${DEMO_AUTH_PASSWORD:}

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.com.flashsale.payment=INFO
logging.level.org.springframework=INFO

# Actuator / Metrics (Prometheus)
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=payment-service
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,redis,rabbit
