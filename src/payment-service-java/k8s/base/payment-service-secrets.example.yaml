apiVersion: v1
kind: Secret
metadata:
  name: payment-service-secrets
  namespace: flashsale
type: Opaque
stringData:
  POSTGRES_JDBC_URL: "jdbc:postgresql://<postgres-host>:5432/FlashSaleDb"
  POSTGRES_USER: "<postgres-user>"
  POSTGRES_PASSWORD: "<postgres-password>"

  RABBITMQ_HOST: "<rabbitmq-host>"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: "<rabbitmq-user>"
  RABBITMQ_PASSWORD: "<rabbitmq-password>"

  REDIS_HOST: "<redis-host>"
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "<redis-password>"

  JWT_SIGNING_KEY: "<32+ byte secret>"
  OIDC_ISSUER_URI: "https://issuer.test"
  OIDC_AUDIENCE: "payment-service"
  OIDC_AUTHORITIES_CLAIM: "roles"
  APP_SECURITY_ALLOWED_ORIGINS: "https://api.<your-domain>,https://www.<your-domain>"
  DEMO_AUTH_PASSWORD: "<only-for-demo-profile>"
  STRIPE_API_KEY: "<sk_test_... or sk_live_... (optional, enables real PSP)>"
