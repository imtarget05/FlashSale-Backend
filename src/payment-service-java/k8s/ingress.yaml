apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payment-service
  namespace: flashsale
  labels:
    app: payment-service
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: payment-service
                port:
                  number: 80
