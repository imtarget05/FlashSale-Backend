apiVersion: v1
kind: Secret
metadata:
  name: payment-service-secrets
  namespace: flashsale
  labels:
    app: payment-service
type: Opaque
stringData:
  # Các giá trị này chỉ dùng làm mẫu. Trong production, cung cấp qua secret store
  # (Vault / Azure Key Vault / Sealed Secrets) và không commit vào repo.
  POSTGRES_USER: "CHANGE_ME"
  POSTGRES_PASSWORD: "CHANGE_ME"
  RABBITMQ_USER: "CHANGE_ME"
  RABBITMQ_PASSWORD: "CHANGE_ME"
  REDIS_PASSWORD: "CHANGE_ME"
  JWT_SIGNING_KEY: "CHANGE_ME_GENERATE_SECURE_32_BYTE_KEY"
