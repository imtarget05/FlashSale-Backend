apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-service-config
  namespace: flashsale
  labels:
    app: payment-service
data:
  SPRING_APPLICATION_NAME: "payment-service"
  SERVER_PORT: "8080"
  SPRING_PROFILES_ACTIVE: "production"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
  APP_JWT_EXPIRATION_MS: "86400000"
  APP_SECURITY_ALLOWED_ORIGINS: "https://api.flashsale.example.com,https://www.flashsale.example.com"
  APP_SECURITY_OIDC_AUTHORITIES_CLAIM: "roles"
  OIDC_ISSUER_URI: "https://auth.flashsale.tanmainguyenbinh.workers.dev/"
  OIDC_AUDIENCE: "payment-service"
  OIDC_AUTHORITIES_CLAIM: "roles"
  GRPC_SERVER_ENABLED: "false"
