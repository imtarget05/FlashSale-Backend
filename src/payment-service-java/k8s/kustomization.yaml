apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flashsale
resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - networkpolicy.yaml
  - pdb.yaml
images:
  - name: flashsale/payment-service
    newName: flashsale/payment-service
    # Digest-pinned image set in deployment.yaml (@sha256:...). Kustomize
    # newTag/newDigest does not apply to digest references; the digest is
    # replaced with the real ACR digest at deploy time (phase 2.6).
