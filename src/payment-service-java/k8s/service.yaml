apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: flashsale
  labels:
    app: payment-service
spec:
  type: LoadBalancer
  selector:
    app: payment-service
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: grpc
      port: 9090
      targetPort: 9090
