# OpsBridge web tier - nginx MAIN configuration.
#
# This file replaces the stock nginx.conf of the base image, because the
# container contract of `Dockerfile.web` differs from the stock image:
#
#   * NON-ROOT: the container runs as uid 1654 (the repository-wide runtime
#     uid, ADR-007). The stock `user nginx;` directive is dropped on purpose:
#     the directive only has an effect when the master process runs as root,
#     and keeping it would only produce a warning on every start.
#   * READ-ONLY ROOT FILESYSTEM: every path nginx writes to lives under
#     /tmp - the pid file and the five temp directories. Nothing else in the
#     filesystem is written to at runtime.
#   * TEMPLATE RENDERING: the server block is not baked into the image, it is
#     rendered from /etc/nginx/templates/opsbridge.conf.template by the
#     official image's envsubst pass. The output directory is
#     NGINX_ENVSUBST_OUTPUT_DIR, which the image sets to /tmp/nginx/conf.d
#     (writable; /etc/nginx is not writable with a read-only root fs). The
#     /etc/nginx/conf.d directory is included as well, so the stock output
#     path keeps working if somebody overrides NGINX_ENVSUBST_OUTPUT_DIR.
#
# The Kubernetes manifest must mount emptyDir volumes at the three writable
# paths below (and set fsGroup: 1654 so uid 1654 may write into them):
#
#   /tmp/nginx/conf.d   the rendered server block (envsubst output)
#   /tmp/nginx/cache    nginx temp directories (client_body, proxy, ...)
#   /tmp/nginx/run      the pid file
#
worker_processes  auto;

# The master process is not root, so it cannot write /run/nginx.pid.
error_log  /dev/stderr  warn;
pid        /tmp/nginx/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /dev/stdout  main;

    # Do not advertise the nginx version in the Server header / error pages.
    server_tokens off;

    # Every path nginx writes to has to be writable with a read-only root
    # filesystem, so they all live under /tmp.
    client_body_temp_path /tmp/nginx/cache/client_body;
    proxy_temp_path       /tmp/nginx/cache/proxy;
    fastcgi_temp_path     /tmp/nginx/cache/fastcgi;
    uwsgi_temp_path       /tmp/nginx/cache/uwsgi;
    scgi_temp_path        /tmp/nginx/cache/scgi;

    sendfile        on;
    keepalive_timeout  65;

    # The rendered server block (envsubst output of the template) and the
    # stock location (kept so the default output path also works).
    include /tmp/nginx/conf.d/*.conf;
    include /etc/nginx/conf.d/*.conf;
}
